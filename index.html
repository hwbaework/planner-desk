<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Desk · 기획 데스크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232684FF'/%3E%3Cstop offset='1' stop-color='%230C66E4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url%28%23g%29'/%3E%3Cpath d='M32 12 L48 28 L32 44 L16 28 Z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 36 L40 44 L32 52 L24 44 Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8f9; --panel: #ffffff; --sub: #f1f2f4; --hover: #f7f8f9;
    --line: #dcdfe4; --line2: #b3b9c4;
    --text: #172b4d; --dim: #44546f; --faint: #626f86;
    --accent: #0c66e4; --accentw: #e9f2ff;
    --danger: #ae2e24; --dangerw: #ffeceb;
    --warn: #a54800; --warnw: #fff7d6;
    --ok: #216e4e; --okw: #dcfff1;
    --violet: #5e4db2; --violetw: #f3f0ff;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  [data-theme="dark"] .btn.primary { color: #1d2125; font-weight: 700; }
  [data-theme="dark"] .cal .day.today .num { color: #1d2125; }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d2125; --panel: #22272b; --sub: #2c333a; --hover: #282e33;
    --line: #38414a; --line2: #454f59;
    --text: #dee4ea; --dim: #b6c2cf; --faint: #8c9bab;
    --accent: #579dff; --accentw: #1c2b41;
    --danger: #ff6b60; --dangerw: #3a1b19;
    --warn: #f0b54a; --warnw: #352a12;
    --ok: #4fd28a; --okw: #123122;
    --violet: #a08bff; --violetw: #2a2346;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.55;
  }
  a { color: var(--accent); }
  button { font-family: inherit; }

  /* ── Top bar ── */
  .top {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
  .brand small { font-weight: 500; color: var(--faint); margin-left: 6px; font-size: 12px; }
  .today { color: var(--dim); font-size: 12px; }
  .top .spacer { flex: 1; }
  .gsearch { position: relative; flex: 1 1 200px; max-width: 460px; min-width: 160px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 6px; padding: 0 10px; background: var(--panel); color: var(--faint); }
  .gsearch:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accentw); }
  .gsearch input { border: none !important; outline: none !important; box-shadow: none !important; padding: 7px 0; background: transparent; width: 100%; }
  .gres { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(9,30,66,.18); max-height: 60vh; overflow-y: auto; display: none; z-index: 50; color: var(--text); }
  .gres.open { display: block; }
  .gres .gh { font-size: 11.5px; font-weight: 700; color: var(--faint); padding: 8px 12px 4px; }
  .gres .gi { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; font-size: 13.5px; }
  .gres .gi.on, .gres .gi:hover { background: var(--accentw); }
  .gres .gi .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gres .gi .sub { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .gres mark { background: var(--warnw); color: inherit; border-radius: 2px; }
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    :root, [data-theme="dark"] { --bg: #fff; --panel: #fff; --sub: #f4f5f7; --hover: #fff; --line: #c9ced6; --text: #000; --dim: #333; --faint: #555; }
    body { background: #fff; zoom: 1 !important; font-size: 12px; }
    .top, .side, #bannerArea, .tabs .crumb, .tabs .sep, .page-head .actions, .card-h .actions, .filters, .seg, .cal-bar button, .cal-kinds,
    .btn, .next, .add, #toast, .modal-bg, .tl-fill input, select.inline::after { display: none !important; }
    .shell { display: block; }
    main { padding: 0; }
    .card, .kpi, .wk, .mx { box-shadow: none; break-inside: avoid; }
    table.t th { position: static; }
    a { color: #000; text-decoration: none; }
    select.inline { border: none; appearance: none; -webkit-appearance: none; padding: 0; }
    .tbl-wrap, .tl-right, .board, .tlw { overflow: visible !important; }
    .tlw { zoom: .62; }
    .board { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cal .day { min-height: 70px; }
  }
  @media (min-width: 901px) { .top { flex-wrap: nowrap; } .top .save-ind { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
  @media (min-width: 901px) and (max-width: 1250px) { .brand small, .top .save-ind { display: none; } .top .btn span { display: none; } .top .btn .ico + span { margin-left: 0; } }
  @media (max-width: 900px) { .gsearch { order: 5; flex: 1 1 100%; max-width: none; } }
  .save-ind { font-size: 12.5px; color: var(--faint); }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; flex: none; }
  .btn .ico + span { margin-left: 6px; }
  .btn.icon { padding: 7px 8px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 26px; height: 26px; }
  .save-ind.dirty { color: var(--warn); }

  .btn {
    border: 1px solid var(--line2); background: var(--panel); color: var(--text);
    padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--sub); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.sm { padding: 4px 9px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--dim); }
  .btn.ghost:hover { background: var(--sub); color: var(--text); }

  /* ── Shell ── */
  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: calc(100vh - 53px); }
  .side { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 10px; }
  .side h3 { font-size: 12px; color: var(--faint); font-weight: 700; letter-spacing: .4px; margin: 4px 8px 6px; }
  .proj {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; color: var(--dim);
  }
  .proj:hover { background: var(--sub); color: var(--text); }
  .proj.active { background: var(--accentw); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 6px 6px 0; }
  .proj .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); flex: none; }
  .cnt { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--dangerw); color: var(--danger); font-weight: 700; }
  .side .add { margin: 10px 8px 0; width: calc(100% - 16px); }
  .side .archived { margin-top: 16px; }

  main { padding: 16px 22px 60px; min-width: 0; }
  .tabs { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 13.5px; color: var(--dim); flex-wrap: wrap; }
  .tabs .crumb { cursor: pointer; }
  .tabs .crumb:hover { color: var(--accent); text-decoration: underline; }
  .tabs .sep { color: var(--faint); }
  .tabs b { color: var(--text); font-weight: 600; }
  .side-nav { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 6px; }
  .side-nav h3 { margin-top: 12px; }
  .navi { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 0 6px 6px 0; cursor: pointer; color: var(--dim); font-weight: 500; }
  .navi:hover { background: var(--sub); color: var(--text); }
  .navi.active { background: var(--accentw); color: var(--accent); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
  .navi .nm { flex: 1; }
  .cnt.gray { background: var(--sub); color: var(--dim); }
  .tab {
    border: none; background: none; padding: 10px 15px; color: var(--dim); cursor: pointer; font-size: 14.5px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
  .tab .cnt { margin-left: 5px; }

  .page-head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .page-head h2 { font-size: 20px; letter-spacing: -.3px; }
  .page-head .meta { color: var(--dim); font-size: 13.5px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .card-h h3 { font-size: 15px; }
  .card-h .sub { color: var(--faint); font-size: 13px; }
  .card-h .actions { margin-left: auto; display: flex; gap: 6px; }
  .card-b { padding: 12px 14px; }
  .empty { color: var(--faint); padding: 18px 14px; text-align: center; font-size: 12.5px; }

  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); }
  .kpi:hover { border-color: var(--line2); }
  .kpi .l { font-size: 13.5px; color: var(--dim); font-weight: 500; }
  .kpi .v { font-size: 28px; font-weight: 700; margin-top: 2px; letter-spacing: -.5px; }
  .kpi .h { font-size: 12.5px; color: var(--faint); }
  .kpi.danger .v { color: var(--danger); }
  .kpi.warn .v { color: var(--warn); }
  .kpi.ok .v { color: var(--ok); }

  .grid2 { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 14px; }

  /* Phase stepper */
  .phases { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
  .ph { border-radius: 8px; padding: 9px 10px; color: #fff; position: relative; min-height: 76px; }
  .ph .t { font-size: 11px; opacity: .85; font-weight: 600; }
  .ph .n { font-size: 13px; font-weight: 700; }
  .ph .p { font-size: 11.5px; margin-top: 6px; opacity: .95; }
  .ph .bar { height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .ph .bar i { display: block; height: 100%; background: #fff; }
  .ph.cur { outline: 3px solid var(--text); outline-offset: 1px; }
  .ph.cur::after { content: "현재"; position: absolute; top: 7px; right: 8px; font-size: 10px; background: rgba(255,255,255,.25); padding: 0 5px; border-radius: 4px; }

  /* Tables */
  .tbl-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th {
    text-align: left; font-weight: 600; color: var(--dim); font-size: 12.5px; background: var(--sub);
    padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0;
  }
  table.t td { padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr:hover td { background: var(--hover); }
  table.t tr:last-child td { border-bottom: none; }
  table.t .link { cursor: pointer; font-weight: 600; }
  table.t .link:hover { color: var(--accent); text-decoration: underline; }
  td.nowrap, th.nowrap { white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: Consolas, "D2Coding", monospace; font-size: 13px; }
  .muted { color: var(--faint); }
  .clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .small { font-size: 12.5px; }

  .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .b-gray { background: var(--sub); color: var(--dim); }
  .b-blue { background: var(--accentw); color: var(--accent); }
  .b-violet { background: var(--violetw); color: var(--violet); }
  .b-green { background: var(--okw); color: var(--ok); }
  .b-amber { background: var(--warnw); color: var(--warn); }
  .b-red { background: var(--dangerw); color: var(--danger); }
  .b-muted { background: transparent; color: var(--faint); border: 1px dashed var(--line2); }
  .chip-ref { display: inline-block; font-size: 12px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 4px; color: var(--dim); margin: 2px 3px 0 0; }

  select.inline {
    width: auto; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 3px 5px; font-size: 13px; font-family: inherit;
  }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .chip { border: 1px solid var(--line2); background: var(--panel); color: var(--dim); border-radius: 14px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip.active { background: var(--accentw); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .search { border: 1px solid var(--line2); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; min-width: 200px; font-family: inherit; }

  /* Alerts */
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .alert:last-child { border-bottom: none; }
  .alert .ic { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
  .alert.danger .ic { background: var(--danger); }
  .alert.warn .ic { background: var(--warn); }
  .alert.mine .ic { background: var(--accent); }
  .alert .body { flex: 1; min-width: 0; }
  .alert .k { font-size: 12.5px; font-weight: 700; }
  .alert.danger .k { color: var(--danger); }
  .alert.warn .k { color: var(--warn); }
  .alert.mine .k { color: var(--accent); }
  .alert .tt { font-weight: 600; cursor: pointer; }
  .alert .tt:hover { color: var(--accent); }
  .alert .d { color: var(--dim); font-size: 13px; }
  .alert .acts { display: flex; gap: 4px; flex: none; }

  /* Methodology matrix (산출물) */
  .mx { display: grid; grid-template-columns: 210px 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
  .mx + .mx { margin-top: 10px; }
  .mx-ph { color: #fff; padding: 12px 14px; }
  .mx-ph .id { font-size: 12px; font-weight: 600; opacity: .85; }
  .mx-ph .nm { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .mx-ph ul { list-style: none; font-size: 12px; opacity: .95; }
  .mx-ph li::before { content: "▪ "; opacity: .7; }
  .mx-ph .prog { margin-top: 10px; font-size: 11.5px; }
  .mx-body { min-width: 0; }
  .mx-body .foot { padding: 6px 9px; border-top: 1px solid var(--line); }

  /* Timeline */
  .tl { list-style: none; position: relative; margin-left: 6px; }
  .tl li { position: relative; padding: 0 0 12px 18px; border-left: 2px solid var(--line); }
  .tl li:last-child { border-left-color: transparent; }
  .tl li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line2); }
  .tl li.resp::before { border-color: var(--ok); background: var(--okw); }
  .tl li.mine::before { border-color: var(--accent); background: var(--accentw); }
  .tl li.bad::before { border-color: var(--danger); background: var(--dangerw); }
  .tl .h { font-size: 12px; color: var(--dim); }
  .tl .h b { color: var(--text); }
  .tl .x { white-space: pre-wrap; word-break: break-word; font-size: 12.8px; margin-top: 2px; }

  /* Gantt */
  .gantt { position: relative; height: 16px; background: var(--sub); border-radius: 4px; min-width: 220px; }
  .gantt .bar { position: absolute; top: 3px; height: 10px; border-radius: 3px; opacity: .85; }
  .gantt .bar i { display: block; height: 100%; background: rgba(0,0,0,.28); border-radius: 3px 0 0 3px; }
  .gantt .todayline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--danger); }
  input.progress { width: 58px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; text-align: right; background: var(--panel); color: var(--text); font-family: inherit; font-size: 12px; }

  /* 요약 (Jira 요약 화면 구조) */
  .week { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
  .wk { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
  .wk-i { width: 34px; height: 34px; border-radius: 50%; background: var(--sub); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ov { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .donut { display: flex; align-items: center; gap: 14px; }
  .dn-v { font-size: 26px; font-weight: 700; fill: var(--text); }
  .dn-l { font-size: 11px; fill: var(--faint); }
  .dn-legend div { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; color: var(--dim); }
  .dn-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .dn-legend b { color: var(--text); margin-left: 2px; }
  .ov-types { flex: 1; min-width: 200px; }
  .ov-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; font-size: 13px; }
  .ov-bar { flex: 1; height: 8px; background: var(--sub); border-radius: 4px; overflow: hidden; }
  .ov-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  @media (max-width: 900px) { .week { grid-template-columns: repeat(2, minmax(0,1fr)); } }

  .mrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .mrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow label { display: inline-flex; align-items: center; gap: 4px; }
  .mrow input[type=date] { width: 128px; height: 26px; padding: 0 4px; font-size: 12px; }

  .td { margin-bottom: 14px; }
  .td-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
  .td-col { padding: 10px 14px; min-width: 0; }
  .td-col + .td-col { border-left: 1px solid var(--line); }
  .td-h { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .td-i { display: flex; align-items: center; gap: 6px; padding: 5px 0; font-size: 13.5px; cursor: pointer; border-bottom: 1px dashed var(--line); min-width: 0; }
  .td-i:hover .nm { color: var(--accent); }
  .td-i .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-k { font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .td-k.danger { color: var(--danger); } .td-k.warn { color: var(--warn); } .td-k.mine { color: var(--accent); }
  @media (max-width: 900px) { .td-grid { grid-template-columns: 1fr; } .td-col + .td-col { border-left: none; border-top: 1px solid var(--line); } }

  .rg { display: grid; gap: 3px; }
  .rg-row { display: grid; grid-template-columns: 36px repeat(3, 1fr); gap: 3px; align-items: center; }
  .rg-l, .rg-x { font-size: 11px; color: var(--faint); text-align: center; }
  .rg-c { height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .rg-c.h { background: var(--dangerw); color: var(--danger); }
  .rg-c.m { background: var(--warnw); color: var(--warn); }
  .rg-c.l { background: var(--sub); color: var(--dim); }

  /* Project tag */
  .ti { width: 16px; height: 16px; flex: none; vertical-align: -3px; display: inline-block; }
  .ti + .tlabel { margin-left: 6px; }
  .pill .ti { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
  .epic-lz { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 3px; border: 1px solid; white-space: nowrap; margin-right: 4px; }
  [data-theme="dark"] .epic-lz { filter: brightness(1.6) saturate(.8); background: transparent !important; }
  .ms-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 0 8px; border: 1px solid var(--accent); border-radius: 3px; color: var(--accent); white-space: nowrap; }
  .ms-tag i { width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); display: inline-block; }
  .ptag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
  .ptag i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* Calendar */
  .cal-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .cal-title { font-size: 16px; min-width: 110px; text-align: center; }
  .cal-kinds { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  .cal .dow { padding: 7px 8px; font-size: 12.5px; font-weight: 600; color: var(--dim); background: var(--sub); border-bottom: 1px solid var(--line); }
  .cal .day { min-height: 112px; padding: 4px 5px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
  .cal .day:nth-child(7n) { border-right: none; }
  .cal .day:hover { background: var(--hover); }
  .cal .day.out { background: var(--sub); }
  .cal .day.out .num { color: var(--faint); }
  .cal .day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal .num { font-size: 13px; font-weight: 600; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; margin-bottom: 2px; }
  .cal .sun { color: var(--danger); }
  .cal .sat { color: var(--accent); }
  .cal .day.today .num { background: var(--accent); color: #fff; }
  .cal .day .dn, .cal-agenda { display: none; }
  .pill { font-size: 12.5px; line-height: 1.35; padding: 1px 5px; margin-top: 2px; border-radius: 3px; border-left: 3px solid var(--line2); background: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill:hover { background: var(--accentw); }
  .pill .k { color: var(--faint); font-size: 10.5px; margin-right: 4px; }
  .pill.done { text-decoration: line-through; color: var(--faint); }
  .cal .more { font-size: 11px; color: var(--dim); margin-top: 2px; padding-left: 4px; }

  /* Board (Jira 보드 구조) */
  .board-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow-x: auto; max-width: 100%; }
  .seg button { white-space: nowrap; flex: none; border: none; background: var(--panel); color: var(--dim); padding: 6px 12px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--accentw); color: var(--accent); font-weight: 700; }
  .lane-h { font-weight: 700; font-size: 14px; margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--sub); border-radius: 6px; padding: 8px; min-height: 160px; display: flex; flex-direction: column; gap: 6px; }
  .col.over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accentw); }
  .col-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--dim); padding: 2px 4px 4px; text-transform: uppercase; letter-spacing: .2px; }
  .col-h .n { font-weight: 600; color: var(--faint); }
  .kcard { background: var(--panel); border-radius: 4px; padding: 9px 10px; box-shadow: 0 1px 1px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.31); cursor: grab; border-left: 3px solid transparent; }
  .kcard:hover { background: var(--hover); }
  .kcard.dragging { opacity: .45; }
  .kcard .tt { font-size: 14px; line-height: 1.4; word-break: break-word; cursor: pointer; }
  .kcard .tt:hover { color: var(--accent); }
  .kcard .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .kcard .key { font-weight: 600; color: var(--faint); font-size: 12px; }
  .kcard .due { padding: 0 6px; border-radius: 3px; background: var(--sub); font-weight: 600; }
  .kcard .due.late { background: var(--dangerw); color: var(--danger); }
  .kcard .due.soon { background: var(--warnw); color: var(--warn); }
  .kcard .av { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .kcard .next { border: none; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0 2px; font-family: inherit; visibility: hidden; }
  .kcard:hover .next { visibility: visible; }
  @media (hover: none) { .kcard .next { visibility: visible; font-size: 13px; padding: 4px 6px; } }
  .kcard .warnline { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--danger); }
  .col .add { border: none; background: none; text-align: left; color: var(--dim); padding: 6px 4px; border-radius: 4px; cursor: pointer; font-size: 13.5px; font-family: inherit; }
  .col .add:hover { background: var(--line); color: var(--text); }

  /* Timeline (Jira 타임라인 구조) */
  .tl-bar-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tlw { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
  .tl-left { border-right: 1px solid var(--line); min-width: 0; }
  .tl-right { overflow-x: auto; position: relative; }
  .tl-h, .tl-r { height: 36px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .tl-h { background: var(--sub); font-size: 12.5px; color: var(--dim); font-weight: 600; }
  .tl-left .tl-r { padding: 0 10px; gap: 6px; font-size: 13.5px; min-width: 0; }
  .tl-left .tl-r .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .tl-left .tl-r .nm:hover { color: var(--accent); }
  .tl-left .tl-r.grp { background: var(--sub); font-weight: 700; }
  .tl-left .tl-r.epic { font-weight: 600; }
  .tl-left .tl-r .who { font-size: 12px; color: var(--faint); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-right .tl-r, .tl-right .tl-h { position: relative; padding: 0; }
  .tl-right .tl-r.grp { background: var(--sub); }
  .tl-cell { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 11.5px; padding: 0 4px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .tl-cell.we { background: rgba(9,30,66,.03); }
  .tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
  .tl-bar { position: absolute; top: 9px; height: 18px; border-radius: 4px; cursor: pointer; z-index: 1; font-size: 11px; color: #fff; padding: 0 6px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
  .tl-bar.done { opacity: .45; }
  .tl-bar.late { box-shadow: 0 0 0 2px var(--danger); }
  .tl-bar.epic { top: 12px; height: 12px; border-radius: 3px; }
  .tl-ms { position: absolute; top: 11px; width: 14px; height: 14px; transform: rotate(45deg); cursor: pointer; z-index: 1; border-radius: 2px; }
  .tl-fill { position: absolute; left: 8px; top: 0; bottom: 0; display: flex; gap: 4px; align-items: center; z-index: 1; }
  .tl-fill input[type=date] { width: 124px; height: 24px; padding: 0 4px; font-size: 12px; border-radius: 4px; }
  .tl-fill span { font-size: 11.5px; color: var(--warn); font-weight: 600; white-space: nowrap; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.38); display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal.wide { max-width: 900px; }
  .modal-h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 8px; }
  .modal-h h2 { font-size: 15.5px; flex: 1; }
  .modal-b { padding: 16px 18px; max-height: calc(100vh - 200px); overflow-y: auto; }
  .modal-f { display: flex; gap: 6px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
  .modal-f .left { margin-right: auto; }

  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .form .full { grid-column: 1 / -1; }
  .form label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; font-weight: 600; }
  .form .hint { font-size: 12px; color: var(--faint); margin-top: 2px; font-weight: 400; }
  input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
    width: 100%; border: 1px solid var(--line2); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accentw); border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
  select[multiple] { min-height: 110px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .check input { width: auto; }

  .info { display: grid; grid-template-columns: 110px 1fr; gap: 7px 12px; font-size: 14px; }
  .info .l { color: var(--dim); font-size: 13px; padding-top: 1px; }
  .quick { display: flex; flex-wrap: wrap; gap: 5px; margin: 14px 0 8px; }
  .evform { display: grid; grid-template-columns: 140px 140px 1fr auto; gap: 6px; align-items: start; margin-bottom: 14px; }
  .evform textarea { min-height: 38px; }
  .evform.tlform { grid-template-columns: 140px 1fr auto; }
  .sec-t { font-size: 12px; font-weight: 700; color: var(--dim); margin: 14px 0 8px; }

  .banner { background: var(--warnw); color: var(--warn); border: 1px solid var(--warn); border-radius: 8px; padding: 9px 14px; margin-bottom: 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner .btn { margin-left: auto; }
  .note-box { background: var(--sub); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; color: var(--dim); }
  .note-box b { color: var(--text); }
  .note-box ol, .note-box ul { margin: 6px 0 0 18px; }

  .mailcand { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .mailcand .subj { font-weight: 700; }
  .mailcand .from { font-size: 12px; color: var(--dim); }
  .mailcand .snip { font-size: 12px; color: var(--dim); white-space: pre-wrap; max-height: 64px; overflow: hidden; margin: 6px 0; }
  .mailcand .row { display: grid; grid-template-columns: 1fr 150px 140px auto auto; gap: 6px; align-items: center; }
  .drop { border: 2px dashed var(--line2); border-radius: 8px; padding: 14px; text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 8px; }
  .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accentw); }

  .notes-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  .note-item { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .note-item:hover { background: var(--hover); }
  .note-item.active { background: var(--accentw); }
  .note-item .t { font-weight: 600; font-size: 13px; }
  .note-item .m { font-size: 11.5px; color: var(--faint); }
  #noteContent { min-height: 52vh; font-size: 13.5px; }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1b2230; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 90vw; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { border-right: none; border-bottom: 1px solid var(--line); }
    .top { position: static; padding: 8px 12px; gap: 8px; }
    .top .save-ind, .brand small { display: none; }
    .side { padding: 10px 10px 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .side > h3 { display: none; }
    .proj { border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; }
    .proj.active { box-shadow: none; border-color: var(--accent); border-radius: 14px; }
    .side .add { width: auto; margin: 0; }
    .side .archived { display: none; }
    .cal .day { min-height: 70px; padding: 3px; }
    .pill { font-size: 11px; padding: 1px 3px; }
    .side-nav { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; width: 100%; }
    .tlw { grid-template-columns: 140px 1fr; }
    .tl-left .tl-r .who, .tl-left .tl-h span { display: none; }
    .tl-left .tl-r { padding-left: 6px !important; font-size: 12.5px; }
    .side-nav h3 { display: none; }
    .navi { border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; }
    .navi.active { box-shadow: none; border-color: var(--accent); }
    .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid2, .notes-wrap { grid-template-columns: 1fr; }
    .phases { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .mx { grid-template-columns: 1fr; }
    .form { grid-template-columns: 1fr; }
    .evform, .mailcand .row { grid-template-columns: 1fr 1fr; }
    main { padding: 14px 16px 60px; }
  }
  @media (max-width: 600px) {
    .evform, .evform.tlform { grid-template-columns: 1fr; }
    .mrow { flex-wrap: wrap; }
    .mrow .nm { flex: 1 1 100%; white-space: normal; }
    .mrow input[type=date] { flex: 1 1 140px; width: auto; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side, main { min-width: 0; }
    .side-nav { flex-wrap: nowrap; overflow-x: auto; min-width: 0; max-width: 100%; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .side-nav > * { flex: none; }
    .cal-kinds { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 10px; max-width: 100%; }
    .cal-kinds label { flex: none; }
    .cal .day { min-height: 48px; }
    .cal .day .pill, .cal .day .more { display: none; }
    .cal .day .dn { display: inline-block; margin-top: 2px; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accentw); border-radius: 8px; padding: 0 6px; }
    .cal-agenda { display: block; margin-top: 14px; }
    .proj-list { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; width: 100%; min-width: 0; padding-bottom: 2px; }
    .proj-list > * { flex: none; }
    .proj-list .proj .nm { max-width: 44vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .savenag .why { display: none; }
    .tcards td.tc-title + td select.inline { padding: 2px 4px; height: 28px; }
    /* 업무 표 → 카드: 제목 한 줄, 아래에 상태·마감·담당 */
    .tcards thead, .tcards .tc-opt { display: none; }
    .tcards tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    .tcards td { display: block; border: none !important; box-shadow: none; padding: 0 !important; }
    .tcards td:empty { display: none; }
    .tcards td.tc-title { flex: 1 1 100%; order: -1; }
    .tcards td.empty { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232684FF'/%3E%3Cstop offset='1' stop-color='%230C66E4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url%28%23g%29'/%3E%3Cpath d='M32 12 L48 28 L32 44 L16 28 Z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 36 L40 44 L32 52 L24 44 Z' fill='white'/%3E%3C/svg%3E" alt="">Planner Desk <small>기획 · PMO 데스크</small></div>
    <div class="today" id="todayLabel"></div>
  </div>
  <div class="gsearch">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="gq" type="text" placeholder="검색 (Ctrl+K) — 업무·전달·산출물·데이터·화면·테스트·메모" autocomplete="off" oninput="gSearch(this.value)" onkeydown="gKey(event)" onfocus="gSearch(this.value)">
    <div id="gres" class="gres"></div>
  </div>
  <div class="spacer"></div>
  <span class="save-ind" id="saveInd"></span>
  <button class="btn primary" onclick="quickCreate()" title="어디서든 바로 만들기 (C)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>만들기</span></button>
  <button class="btn" onclick="saveFile(false)" title="데이터를 내장한 HTML로 저장 (Ctrl+S). 저장 위치를 한 번 지정하면 이후 같은 파일에 자동 저장"><svg class="ico" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span>저장</span></button>
  <button class="btn" onclick="openReport()" title="주간보고 초안"><svg class="ico" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg><span>주간보고</span></button>
  <input type="file" id="importFile" accept=".html,.htm,.json,.txt" style="display:none" onchange="importFile(event)">
  <button class="btn ghost icon" onclick="toggleTheme()" title="화이트 / 다크 전환" id="themeBtn"></button>
  <button class="btn ghost icon" onclick="openSettings()" title="설정 · 불러오기 · 다른 이름으로 저장"><svg class="ico" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
</header>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main>
    <div id="bannerArea"></div>
    <nav class="tabs" id="tabs"></nav>
    <section id="view"></section>
  </main>
</div>

<div class="modal-bg" id="modalBg" onmousedown="if(event.target===this) closeModal()">
  <div class="modal" id="modal">
    <div class="modal-h"><h2 id="modalTitle"></h2><button class="btn ghost icon" onclick="closeModal()" title="닫기 (Esc)"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f" id="modalFoot"></div>
  </div>
</div>
<div id="toast"></div>

function persist() {
  S.updatedAt = new Date().toISOString();
  ["tasks", "events", "recurring", "datas", "tcs", "reqs", "risks", "docs", "handoffs", "screens", "wbs", "notes"].forEach((k) => S[k].forEach((x) => { if (x.createdAt === undefined) x.createdAt = S.updatedAt; }));
  writeLocal(true); dirty = true; updateSaveInd();
  if (fileHandle) { clearTimeout(fileTimer); fileTimer = setTimeout(() => writeToHandle(true), 1500); }
}
function commit() { persist(); render(); }

// ───────────── file save / load ─────────────
function buildHtml() {
  const copy = Object.assign({}, S); delete copy._embeddedOlder;
  copy.fileSavedAt = new Date().toISOString();
  const json = JSON.stringify(copy).replace(/</g, "\\u003c");
  return PRISTINE.replace(EMBED_RE, () => "var EMBEDDED_DATA = " + json + "; /*EMBEDDED_DATA" + "_PLACEHOLDER*/");
}
// 저장 위치(FileSystemFileHandle)를 IndexedDB에 기억 — 새로 열어도 [저장]이 같은 파일에 쓴다
function idb(mode, fn) {
  return new Promise((res) => {
    try {
      const rq = indexedDB.open("planner-desk", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onsuccess = () => { const tx = rq.result.transaction("kv", mode); const r = fn(tx.objectStore("kv")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(null); };
      rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
const HANDLE_KEY = "fileHandle:" + STORE_KEY;
function rememberHandle(h) { if (h) idb("readwrite", (st) => st.put(h, HANDLE_KEY)); }
async function restoreHandle() {
  if (!window.showSaveFilePicker) return;
  const h = await idb("readonly", (st) => st.get(HANDLE_KEY));
  if (h && h.kind === "file") { savedHandle = h; updateSaveInd(); }
}
let savedHandle = null;
// 파일로 저장한 시각 (브라우저 데이터만 있는 기간을 알리기 위해)
function markFileSaved() { S.fileSavedAt = new Date().toISOString(); writeLocal(); render(); }
async function writeToHandle(silent) {
  if (!fileHandle) return false;
  try {
    const w = await fileHandle.createWritable(); await w.write(buildHtml()); await w.close();
    dirty = false; lastFileSave = new Date(); markFileSaved(); updateSaveInd();
    if (!silent) toast("저장 완료 → " + fileHandle.name);
    return true;
  } catch (e) { fileHandle = null; updateSaveInd(); toast("파일 쓰기 실패 — 다시 저장 위치를 지정해줘"); return false; }
}
async function saveFile(pick) {
  // 지난번 저장 위치가 기억돼 있으면 권한만 다시 받아 같은 파일에
  if (!pick && !fileHandle && savedHandle) {
    try { if ((await savedHandle.requestPermission({ mode: "readwrite" })) === "granted") fileHandle = savedHandle; } catch (e) {}
  }
  if (window.showSaveFilePicker && (pick || !fileHandle)) {
    try {
      fileHandle = await window.showSaveFilePicker({ suggestedName: savedHandle?.name || `planner-desk_${stamp()}.html`, types: [{ description: "HTML", accept: { "text/html": [".html"] } }] });
      savedHandle = fileHandle; rememberHandle(fileHandle);
    } catch (e) { if (e.name === "AbortError") return; fileHandle = null; }
  }
  if (fileHandle && (await writeToHandle(false))) return;
  download(`planner-desk_${stamp()}.html`, buildHtml(), "text/html");
  dirty = false; lastFileSave = new Date(); markFileSaved(); updateSaveInd();
  toast("백업 HTML 다운로드 — 그 파일을 열면 지금 데이터 그대로 열림");
}
function updateSaveInd() {
  const el = $("saveInd"); if (!el) return;
  const t = lastFileSave ? lastFileSave.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : null;
  if (!fileHandle && savedHandle) { el.className = "save-ind" + (dirty ? " dirty" : ""); el.textContent = `${savedHandle.name} · [저장]으로 이어서 저장`; return; }
  if (fileHandle) { el.className = "save-ind" + (dirty ? " dirty" : ""); el.textContent = `${fileHandle.name} · ${dirty ? "저장 대기…" : "자동저장 " + t}`; }
  else { el.className = "save-ind" + (dirty ? " dirty" : ""); el.textContent = dirty ? "브라우저에 저장됨 · 파일 미저장" : t ? `파일 저장 ${t}` : "브라우저에 자동 저장 중"; }
}
function importFile(ev) {
  const f = ev.target.files[0]; ev.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const txt = r.result;
      let m = txt.match(/var EMBEDDED_DATA = ([\s\S]+?); \/\*EMBEDDED_DATA_PLACEHOLDER\*\//);
      if (m && m[1].trim() !== "null") {
        const d = JSON.parse(m[1]);
        if (!confirm(`Planner Desk 백업을 불러올까?\n프로젝트 ${d.projects?.length || 0}개 · 전달 ${d.handoffs?.length || 0}건 · 산출물 ${d.docs?.length || 0}건\n현재 데이터는 덮어씌워져.`)) return;
        S = normalize(d); commit(); toast("불러오기 완료"); return;
      }
      m = txt.match(/var EMBEDDED_BACKUP_DATA = ([\s\S]+?); \/\*EMBEDDED_BACKUP_PLACEHOLDER\*\//);
      if (m && m[1].trim() !== "null") { importLegacy(JSON.parse(m[1])); return; }
      const d = JSON.parse(txt);
      if (Array.isArray(d.mails) && !d.projects) { importMailJson(d); return; }
      if (d.tasks && !d.handoffs) { importLegacy(d); return; }
      if (!confirm("JSON 데이터를 불러올까? 현재 데이터는 덮어씌워져.")) return;
      S = normalize(d); commit(); toast("불러오기 완료");
    } catch (e) { alert("불러오기 실패: " + e.message); }
  };
  r.readAsText(f, "utf-8");
}
// 기존 '사업관리 대시보드' 백업 → 프로젝트/WBS(업무)/메모로 합치기
function importLegacy(d) {
  const ps = (d.projects || []).filter((p) => p.name);
  const ts = Array.isArray(d) ? d : d.tasks || [];
  const ns = d.notes || [];
  if (!confirm(`기존 사업관리 대시보드 백업을 '추가'로 가져올까?\n프로젝트 ${ps.length}개 · 업무 ${ts.length}개 · 일정 ${(d.events || []).length}개 · 정기 ${(d.recurring || []).length}개 · 메모 ${ns.length}개\n현재 데이터는 유지돼.`)) return;
  const byName = {};
  S.projects.forEach((p) => (byName[p.name] = p.id));
  const ensure = (name) => {
    name = name || "기타";
    if (!byName[name]) { const p = { id: uid("p"), name, client: "", start: "", end: "", memo: "기존 대시보드에서 가져옴", archived: false, color: PROJ_COLORS[S.projects.length % PROJ_COLORS.length] }; S.projects.push(p); byName[name] = p.id; }
    return byName[name];
  };
  ps.forEach((p) => { const id = ensure(p.name); if (p.archived) S.projects.find((x) => x.id === id).archived = true; });
  ts.forEach((t) => S.tasks.push(legacyTask(t, ensure(t.project))));
  const linked = new Set(ts.map((t) => t.calendarEventId).filter(Boolean));   // 업무에서 만든 캘린더 일정은 업무 마감으로 이미 표시됨
  (d.events || []).filter((e) => !linked.has(e.id)).forEach((e) => S.events.push(legacyEvent(e, ensure(e.project))));
  (d.recurring || []).forEach((r) => S.recurring.push(legacyRecur(r, ensure(r.project))));
  ns.forEach((n) => S.notes.push({ id: uid("n"), projectId: ensure(n.project), title: n.title || "", date: n.date || today(), content: n.content || "", updatedAt: new Date().toISOString() }));
  commit(); toast("기존 데이터 가져오기 완료");
}

function legacyTask(t, pid) {
  return { id: uid("t"), projectId: pid, title: t.title || "(제목 없음)", status: TASK_ST.includes(t.status) ? t.status : "진행중",
    priority: { high: "high", medium: "mid", low: "low" }[t.priority] || "mid", start: t.awarenessDate || (t.createdAt || "").slice(0, 10),
    due: t.due || "", owner: t.owner || "", memo: t.notes || "", updatedAt: t.updatedAt || "" };
}
function legacyEvent(e, pid) {
  return { id: uid("ev"), projectId: pid, title: e.title || "", type: EVENT_TYPES.includes(e.type) ? e.type : "기타", start: e.startDate || "", end: e.endDate || "", location: e.location || "", memo: e.notes || "" };
}
function legacyRecur(r, pid) {
  return { id: uid("r"), projectId: pid, title: r.title || "", freq: r.recurType === "monthly" ? "monthly" : "weekly", day: Number(r.recurDay) || 0,
    nextDue: r.nextDue || "", recipient: r.recipient || "", path: r.filePath || "", memo: r.notes || "", lastDone: r.lastCompleted || "", history: (r.history || []).map((h) => h.date) };
}

// ───────────── domain helpers ─────────────
function proj(id) { return S.projects.find((p) => p.id === id); }
function projName(id) { return proj(id)?.name || "-"; }
function projColor(id) { return proj(id)?.color || "#8b93a1"; }
function projTag(id) { return `<span class="ptag"><i style="background:${projColor(id)}"></i>${esc(projName(id))}</span>`; }
function activeProjects() { return S.projects.filter((p) => !p.archived); }
function inScope(x) { return S.ui.pid === "all" ? !proj(x.projectId)?.archived : x.projectId === S.ui.pid; }
function ackDaysOf(pid) { const p = proj(pid); return Number(p?.ackDays) || Number(S.settings.ackDays) || 2; }
function hoStLabel(s) { return (HO_ST.find((x) => x[0] === s) || [s, s])[1]; }
function evLabel(t) { return (EV_TYPES.find((x) => x[0] === t) || [t, t])[1]; }
function lastEvent(h, types) { return [...h.events].filter((e) => !types || types.includes(e.type)).sort((a, b) => (a.at + (a.ts || "")).localeCompare(b.at + (b.ts || ""))).pop(); }
function isOpenHO(h) { return h.status !== "verified" && h.status !== "hold"; }

function applyTemplate(p) {
  PHASES.forEach((ph) => {
    ph.docs.forEach((name, i) => S.docs.push({ id: uid("d"), projectId: p.id, phase: ph.id, name, status: "미착수", version: "v0.1", owner: "", plan: "", requestedAt: "", approvedAt: "", approver: "", path: "", memo: "", history: [], order: i }));
    ph.acts.forEach((title) => S.wbs.push({ id: uid("w"), projectId: p.id, phase: ph.id, title, owner: "", start: "", end: "", progress: 0, memo: "" }));
  });
}

// 확인 필요 항목(노티 미수신, 승인 회신 없음, 일정 지연 등)
function computeAlerts(pid) {
  const out = [], t = today(), st = S.settings;
  const scope = (x) => (pid ? x.projectId === pid : !proj(x.projectId)?.archived);
  S.handoffs.filter(scope).forEach((h) => {
    if (!isOpenHO(h)) return;
    const lastResp = lastEvent(h, RESP_EV);
    const ackLimit = ackDaysOf(h.projectId);
    if (h.status === "sent" && h.sentAt) {
      const bd = bizDays(h.sentAt);
      if (bd > ackLimit) out.push({ level: "danger", kind: "접수 노티 없음", ref: ["ho", h.id], pid: h.projectId, days: bd, title: `[${h.code}] ${h.title}`, desc: `${h.to || "수신자"}에게 ${shortD(h.sentAt)} 전달 후 영업일 ${bd}일째 회신 없음 (기준 ${ackLimit}일)` });
    }
    if (["sent", "ack", "dev"].includes(h.status) && h.dueDate && h.dueDate < t) {
      out.push({ level: "danger", kind: "완료 노티 없음", ref: ["ho", h.id], pid: h.projectId, days: calDays(h.dueDate), title: `[${h.code}] ${h.title}`, desc: `완료 예정 ${shortD(h.dueDate)} 경과 (${dday(h.dueDate)}) · 현재 ${hoStLabel(h.status)}` });
    } else if (["ack", "dev"].includes(h.status)) {
      const base = lastResp?.at || h.sentAt;
      const bd = bizDays(base);
      if (bd > Number(st.quietDays)) out.push({ level: "warn", kind: "진행 공유 없음", ref: ["ho", h.id], pid: h.projectId, days: bd, title: `[${h.code}] ${h.title}`, desc: `마지막 응답 ${shortD(base)} 이후 영업일 ${bd}일 무소식` });
    }
    if (h.status === "done") {
      const de = lastEvent(h, ["done"]);
      const bd = bizDays(de?.at || t);
      if (bd >= Number(st.verifyDays)) out.push({ level: "mine", kind: "내 검수 대기", ref: ["ho", h.id], pid: h.projectId, days: bd, title: `[${h.code}] ${h.title}`, desc: `완료 노티 ${shortD(de?.at)} 받음 → 기획 검수 필요 (${bd}일 경과)` });
    }
  });
  S.docs.filter(scope).forEach((d) => {
    if (d.status === "검토요청" && d.requestedAt) {
      const bd = bizDays(d.requestedAt);
      if (bd > Number(st.approvalDays)) out.push({ level: "danger", kind: "승인 회신 없음", ref: ["doc", d.id], pid: d.projectId, days: bd, title: d.name, desc: `${shortD(d.requestedAt)} 검토요청 후 영업일 ${bd}일 · 승인자 ${d.approver || "미지정"}` });
    }
    if (d.plan && d.plan < t && !["승인", "해당없음", "검토요청"].includes(d.status)) {
      out.push({ level: "warn", kind: "산출물 일정 지연", ref: ["doc", d.id], pid: d.projectId, days: calDays(d.plan), title: `${d.phase} ${d.name}`, desc: `계획 ${shortD(d.plan)} (${dday(d.plan)}) · ${d.status}` });
    }
  });
  S.wbs.filter(scope).forEach((w) => {
    if (w.end && w.end < t && Number(w.progress) < 100) out.push({ level: "warn", kind: "WBS 지연", ref: ["wbs", w.id], pid: w.projectId, days: calDays(w.end), title: w.title, desc: `종료 ${shortD(w.end)} (${dday(w.end)}) · 진척 ${w.progress || 0}%` });
  });
  S.tasks.filter(scope).forEach((x) => {
    if (x.status !== "완료" && x.due && x.due < t) out.push({ level: "warn", kind: "업무 마감 지남", ref: ["task", x.id], pid: x.projectId, days: calDays(x.due), title: x.title, desc: `마감 ${shortD(x.due)} (${dday(x.due)}) · ${x.status}${x.owner ? " · " + x.owner : ""}` });
  });
  S.datas.filter(scope).forEach((x) => {
    if (["합의", "수신 중"].includes(x.status) && x.dueDate && x.dueDate < t && !(x.lastReceivedAt && x.lastReceivedAt >= x.dueDate))
      out.push({ level: "danger", kind: "데이터 미수신", ref: ["data", x.id], pid: x.projectId, days: calDays(x.dueDate), title: x.name, desc: `${x.org || "제공 기관"} · 수신 예정 ${shortD(x.dueDate)} (${dday(x.dueDate)}) 지남${x.contact ? " · " + x.contact : ""}` });
    else if (x.status === "협의 중") {
      const last = [...x.log].sort((a, b) => a.at.localeCompare(b.at)).pop()?.at || x.requestedAt;
      const bd = last ? bizDays(last) : 0;
      if (bd > Number(st.quietDays)) out.push({ level: "warn", kind: "데이터 협의 지연", ref: ["data", x.id], pid: x.projectId, days: bd, title: x.name, desc: `${x.org || "제공 기관"} · 마지막 협의 ${shortD(last)} 이후 영업일 ${bd}일` });
    }
  });
  S.tcs.filter(scope).forEach((c) => {
    const ho = c.hoId && S.handoffs.find((h) => h.id === c.hoId);
    if (c.result === "Fail" && !ho) out.push({ level: "mine", kind: "결함 미전달", ref: ["tc", c.id], pid: c.projectId, days: c.testedAt ? calDays(c.testedAt) : 0, title: `${c.code} ${c.scenario}`, desc: `Fail ${c.testedAt ? shortD(c.testedAt) : ""} · 개발에 결함을 전달하지 않음` });
    if (["Fail", "Block"].includes(c.result) && ho && ["done", "verified"].includes(ho.status)) out.push({ level: "mine", kind: "재테스트 필요", ref: ["tc", c.id], pid: c.projectId, days: 0, title: `${c.code} ${c.scenario}`, desc: `결함 [${ho.code}] ${hoStLabel(ho.status)} → 다시 테스트해서 결과 갱신` });
  });
  S.screens.filter(scope).forEach((sc) => {
    if (sc.hoId && sc.lastSentVer !== undefined && (sc.version || "") !== sc.lastSentVer)
      out.push({ level: "mine", kind: "화면 변경 후 미전달", ref: ["screen", sc.id], pid: sc.projectId, days: sc.revisedAt ? calDays(sc.revisedAt) : 0, title: `${sc.code} ${sc.name}`, desc: `개발엔 ${sc.lastSentVer || "-"} 전달 → 지금 ${sc.version}${sc.revisedAt ? ` (${shortD(sc.revisedAt)} 개정)` : ""} · 변경분 전달 필요` });
  });
  S.risks.filter(scope).forEach((r) => {
    if (r.status === "종료" || r.type === "결정" || r.type === "가정") return;
    if (r.due && r.due < t) out.push({ level: r.status === "모니터링" ? "warn" : "danger", kind: "이슈·리스크 기한 지남", ref: ["risk", r.id], pid: r.projectId, days: calDays(r.due), title: `${r.code} ${r.title}`, desc: `${r.type} · 대응 기한 ${shortD(r.due)} (${dday(r.due)}) · ${r.owner || "담당 미정"}` });
    else if (riskScore(r) >= 6 && !(r.plan || "").trim()) out.push({ level: "warn", kind: "대응 방안 없음", ref: ["risk", r.id], pid: r.projectId, days: 0, title: `${r.code} ${r.title}`, desc: `${r.type} · 영향 ${r.impact} × 가능성 ${r.prob} · 대응 방안을 적어줘` });
  });
  S.reqs.filter(scope).forEach((r) => {
    if (r.status === "확정" && !(r.screenIds || []).length && r.kind !== "비기능")
      out.push({ level: "mine", kind: "화면 미반영 요구사항", ref: ["req", r.id], pid: r.projectId, days: r.confirmedAt ? calDays(r.confirmedAt) : 0, title: `${r.code} ${r.title}`, desc: `확정${r.confirmedAt ? " " + shortD(r.confirmedAt) : ""} · 연결된 화면 없음 — 화면설계에 반영 필요` });
  });
  S.recurring.filter(scope).forEach((r) => {
    if (r.nextDue && r.nextDue < t) out.push({ level: "warn", kind: "정기 업무 지남", ref: ["recur", r.id], pid: r.projectId, days: calDays(r.nextDue), title: r.title, desc: `예정 ${shortD(r.nextDue)} (${dday(r.nextDue)}) · 완료 처리 안 됨` });
  });
  const rank = { danger: 0, mine: 1, warn: 2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level] || b.days - a.days);
}

// 다음 마일스톤 (오늘 포함, 가장 가까운 것)
function milestones(pid) { return S.events.filter((e) => e.projectId === pid && e.type === "마일스톤" && e.start).sort((a, b) => a.start.localeCompare(b.start)); }
function nextMilestone(pid) { return milestones(pid).find((e) => e.start >= today()); }
function msTag(pid) { const m = nextMilestone(pid); return m ? `<span class="ms-tag" title="${esc(m.title)} ${m.start}"><i></i>${esc(m.title)} <b>${dday(m.start)}</b></span>` : ""; }
function currentPhase(pid) {
  const t = today();
  const ws = S.wbs.filter((w) => w.projectId === pid && w.phase && w.start && w.end && w.start <= t && t <= w.end);
  if (ws.length) return ws.map((w) => w.phase).sort()[0];
  for (const ph of PHASES) {
    const ds = S.docs.filter((d) => d.projectId === pid && d.phase === ph.id && d.status !== "해당없음");
    if (ds.some((d) => d.status !== "승인")) return ph.id;
  }
  return null;
}
function docStats(pid, phId) {
  const ds = S.docs.filter((d) => d.projectId === pid && (!phId || d.phase === phId) && d.status !== "해당없음");
  return { total: ds.length, ok: ds.filter((d) => d.status === "승인").length, req: ds.filter((d) => d.status === "검토요청").length, wip: ds.filter((d) => d.status === "작성중").length };
}

// ───────────── render: shell ─────────────
function render() {
  if (noteFlush) noteFlush();   // 메모 입력 중 화면을 바꾸면 먼저 저장
  if (S.ui.pid !== "all" && !proj(S.ui.pid)) S.ui.pid = "all";
  document.documentElement.setAttribute("data-theme", S.settings.theme === "dark" ? "dark" : "light");
  document.body.style.zoom = Number(S.settings.fontScale) || 1;

// 화면 개정: 버전업 + 변경 내용 이력. 이미 개발에 넘긴 화면이면 '변경 후 미전달'로 표시된다.

function relinkScreens() {
  S.screens.forEach((sc) => {
    let best = null, bestTs = "";
    S.handoffs.forEach((h) => {
      if (!(h.screenIds || []).includes(sc.id)) return;
      const ev = h.events.filter((e) => e.type === "sent").map((e) => e.ts || e.at).sort().pop();
      if (ev && ev > bestTs) { best = h; bestTs = ev; }
    });
    if (!best) { delete sc.hoId; delete sc.lastSentVer; delete sc.lastSentAt; return; }
    if (sc.hoId !== best.id) { sc.hoId = best.id; if (sc.lastSentVer === undefined) { sc.lastSentVer = sc.version || ""; sc.lastSentAt = bestTs; } }
  });
}
function reviseScreen(id) {

  if (why === null) return;
  const m = String(sc.version || "v0.0").match(/(\d+)\.(\d+)/);
  const nv = m ? `v${m[1]}.${Number(m[2]) + 1}` : "v0.1";
  sc.history = [...(sc.history || []), { at: today(), ts: new Date().toISOString(), from: sc.version || "", to: nv, text: why }];
  sc.version = nv; sc.status = "변경중"; sc.revisedAt = today();
  commit(); toast(`${sc.code} ${nv}${sc.hoId ? " — 개발에 변경분 전달 필요" : ""}`);
}

function normDate(s) {

  m = String(s).match(/^(\d{1,2})[./-](\d{1,2})$/);

function tcResultChanged(c) {

  for (const cm of text.matchAll(new RegExp(`${prefix}-\\d{2,4}`, "gi"))) {
    const h = S.handoffs.find((x) => x.code.toUpperCase() === cm[0].toUpperCase()); if (h) return { h, why: "코드 " + h.code };
  }
  const em = ((m.from || "").match(/[\w.+-]+@[\w.-]+/) || [""])[0].toLowerCase();
  const subj = (m.subject || "").replace(/^(re|fw|fwd|회신|전달|답장)\s*:\s*/gi, "").toLowerCase();
  let best = null, score = 0;
  S.handoffs.filter(isOpenHO).forEach((h) => {

    if (em && (h.toEmail || "").toLowerCase().includes(em)) s += 2;
    const toks = h.title.toLowerCase().split(/[\s,·/()\[\]-]+/).filter((w) => w.length >= 2);

    if (!hit && sawHeader) break;
    if (!hit && !sawHeader) { if (hd.subject === undefined) hd.subject = l; sawHeader = true; i++; break; }

  const cut = body.search(/\n\s*(-{2,}\s*(Original Message|원본 메시지)\s*-{2,}|보낸 ?사람\s*:|From\s*:)/i);

function decodeWords(s) {

// 주간보고: 금주 실적 → 이슈 → 차주 계획 (개조식). wk=0 이번 주, -1 지난 주
function buildReport(pids, wk) {
  // 기간: 최근 7일(기본) 또는 월~일. 차주 계획은 오늘(지난 주 보고면 그 주 끝) 다음 날부터 다음 주 끝까지
  let t = addDays(today(), 7 * wk);
  if (S.settings.reportWeek === "mon") t = addDays(t, (7 - parseD(t).getDay()) % 7);
  const ws = addDays(t, -6), nx = addDays(t, 7), pFrom = t > today() ? today() : t;
  const inW = (d) => d && d.slice(0, 10) >= ws && d.slice(0, 10) <= t;
  const inN = (d) => d && d > t && d <= nx;
  const body = pids.map((pid) => {
    const p = proj(pid), ds = docStats(pid), ph = currentPhase(pid), L = [];
    const tasks = S.tasks.filter((x) => x.projectId === pid), hos = S.handoffs.filter((h) => h.projectId === pid);
    const datas = S.datas.filter((x) => x.projectId === pid), tcs = tcStats(pid);
    L.push(`■ ${p.name}${ph ? ` (현재 ${ph} ${phase(ph).name})` : ""}`);
    // 1. 금주 실적
    L.push(`1. 금주 실적`);
    const tDone = tasks.filter((x) => x.status === "완료" && inW(x.completedAt || x.updatedAt));
    const tOpen = tasks.filter((x) => x.status !== "완료");
    L.push(`  - 업무: 완료 ${tDone.length}건 · 현재 진행 ${tOpen.length}건`);
    tDone.forEach((x) => L.push(`    · 완료: ${x.title}`));
    // 이번 주 진행 기록이 있는 업무를 먼저, 최근 기록 한 줄과 함께
    const wkLog = (x) => (x.log || []).filter((e) => e.type === "comment" && inW(e.at)).sort((a, b) => (a.at + (a.ts || "")).localeCompare(b.at + (b.ts || "")));
    const logged = tasks.filter((x) => wkLog(x).length);
    logged.forEach((x) => { const lg = wkLog(x), e = lg[lg.length - 1]; L.push(`    · 진행: ${x.title} — ${shortD(e.at)} ${e.text.split("\n")[0].slice(0, 60)}${lg.length > 1 ? ` (이번 주 기록 ${lg.length}건)` : ""}`); });
    tOpen.filter((x) => !logged.includes(x) && (x.priority === "high" || (x.due && x.due <= nx))).slice(0, Math.max(0, 6 - logged.length)).forEach((x) => L.push(`    · 진행: ${x.title}${x.due ? ` (마감 ${shortD(x.due)})` : ""}${x.owner ? ` / ${x.owner}` : ""}`));
    S.recurring.filter((r) => r.projectId === pid && (r.history || []).some(inW)).forEach((r) => L.push(`    · 정기: ${r.title} 완료`));
    const apprW = S.docs.filter((d) => d.projectId === pid && inW(d.approvedAt)), reqW = S.docs.filter((d) => d.projectId === pid && inW(d.requestedAt));
    L.push(`  - 산출물(현재): 승인 ${ds.ok}/${ds.total}${apprW.length ? ` (금주 승인 ${apprW.length})` : ""} · 검토요청 ${ds.req} · 작성중 ${ds.wip}`);
    apprW.forEach((d) => L.push(`    · 승인: ${d.name} ${d.version || ""}`));
    reqW.forEach((d) => L.push(`    · 검토요청: ${d.name} ${d.version || ""}`));
    const sentW = hos.filter((h) => inW(h.sentAt)), doneW = hos.filter((h) => h.events.some((e) => e.type === "done" && inW(e.at))), verW = hos.filter((h) => h.events.some((e) => e.type === "verified" && inW(e.at)));
    L.push(`  - 개발 전달: 전달 ${sentW.length} · 완료 노티 ${doneW.length} · 검수완료 ${verW.length} · 현재 진행 중 ${hos.filter(isOpenHO).length}`);
    sentW.forEach((h) => L.push(`    · 전달: [${h.code}] ${h.title}${h.to ? " → " + h.to : ""}`));
    if (datas.length) {
      const logW = datas.filter((x) => x.log.some((e) => inW(e.at)));
      L.push(`  - 데이터 협의: 수신 완료 ${datas.filter((x) => x.status === "수신 완료").length}/${datas.length} · 협의 중 ${datas.filter((x) => x.status === "협의 중").length}`);
      logW.forEach((x) => { const e = [...x.log].filter((l) => inW(l.at)).pop(); L.push(`    · ${x.org || "기관"} ${x.name}: ${e.type} — ${(e.text || "").split("\n")[0].slice(0, 50)}`); });
    }
    if (tcs.total) L.push(`  - 테스트: ${tcs.total}건 중 수행 ${tcs.total - tcs.todo} · Pass ${tcs.pass} · Fail ${tcs.fail} · Block ${tcs.block}`);
    // 2. 이슈
    const al = computeAlerts(pid).filter((a) => a.ref[0] !== "risk");
    const rk = S.risks.filter((r) => r.projectId === pid && r.status !== "종료" && (r.type === "리스크" || r.type === "이슈")).sort((a, b) => riskScore(b) - riskScore(a));
    const decW = S.risks.filter((r) => r.projectId === pid && r.type === "결정" && inW(r.raisedAt));
    L.push(`2. 이슈 / 리스크: 대장 ${rk.length}건 · 확인 필요 ${al.length}건`);
    rk.slice(0, 8).forEach((r) => L.push(`  - [${r.type} ${r.impact}/${r.prob}] ${r.title}${r.plan ? " → " + r.plan.split("\n")[0].slice(0, 50) : ""}${r.owner ? " / " + r.owner : ""}${r.due ? " (~" + shortD(r.due) + ")" : ""}`));
    decW.forEach((r) => L.push(`  - [결정] ${r.title}`));
    al.slice(0, 8).forEach((a) => L.push(`  - [${a.kind}] ${a.title} — ${a.desc}`));
    // 3. 차주 계획
    L.push(`3. 차주 계획 (${shortD(addDays(t, 1))} ~ ${shortD(nx)})${pFrom < t ? ` · 이번 주 남은 일정 ${shortD(addDays(pFrom, 1))}~ 포함` : ""}`);
    const plan = calItems(addDays(pFrom, 1), nx, pid, { event: 1, task: 1, data: 1, ho: 1, doc: 1, recur: 1, wbs: 1 }).filter((i) => !i.done);
    const wbsRun = S.wbs.filter((w) => w.projectId === pid && Number(w.progress) < 100 && w.start && w.end && w.start <= nx && w.end > t);
    if (!plan.length && !wbsRun.length) L.push(`  - (일정이 등록된 항목 없음 — 타임라인에서 날짜를 채워줘)`);
    plan.forEach((i) => L.push(`  - ${i.date <= t ? "(이번 주) " : ""}${shortD(i.date)} ${CAL_TAG[i.kind] ? "[" + CAL_TAG[i.kind] + "] " : "[" + (i.sub || "일정") + "] "}${i.title}`));
    wbsRun.filter((w) => !plan.some((i) => i.kind === "wbs" && i.title.endsWith(w.title))).forEach((w) => L.push(`  - [WBS 진행] ${w.title} ${w.progress || 0}% (~${shortD(w.end)})`));
    return L.join("\n");
  }).join("\n\n");
  return `주간 보고 (${ws} ~ ${t})${S.settings.me ? " · " + S.settings.me : ""}\n\n` + body;
}
// 주간보고 텍스트를 보고서 모양으로 인쇄 (브라우저 인쇄 창에서 PDF로 저장 가능)
function printReport(text) {
  const lines = text.split("\n");
  const body = lines.map((l) => {
    if (/^주간 보고/.test(l)) return `<h1>${esc(l)}</h1>`;
    if (/^■ /.test(l)) return `<h2>${esc(l.slice(2))}</h2>`;
    if (/^\d\. /.test(l)) return `<h3>${esc(l)}</h3>`;
    if (/^\s{4}· /.test(l)) return `<div class="l3">${esc(l.trim().slice(2))}</div>`;
    if (/^\s{2}- /.test(l)) return `<div class="l2">${esc(l.trim().slice(2))}</div>`;
    return l.trim() ? `<div>${esc(l)}</div>` : "";
  }).join("");
  const w = window.open("", "_blank");
  if (!w) { toast("팝업이 막혀 있어 — 이 사이트의 팝업을 허용해줘"); return; }
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>주간보고 ${today()}</title>
    <style>body{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;color:#172b4d;margin:28px 36px;font-size:13px;line-height:1.6}
    h1{font-size:19px;border-bottom:2px solid #0c66e4;padding-bottom:6px;margin:0 0 14px}h2{font-size:15px;margin:18px 0 6px;color:#0c66e4}
    h3{font-size:13.5px;margin:10px 0 4px}.l2{padding-left:14px;position:relative}.l2:before{content:"-";position:absolute;left:4px}
    .l3{padding-left:30px;color:#44546f}@page{margin:16mm}</style></head><body>${body}
    <div style="margin-top:24px;font-size:11px;color:#626f86">Planner Desk · ${new Date().toLocaleString("ko-KR")}</div></body></html>`);
  w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
}
function openReport(wk = 0) {

function openModal(title, body, buttons = [], wide = false) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = body;
  $("modal").className = "modal" + (wide ? " wide" : "");
  const f = $("modalFoot"); f.innerHTML = "";
  buttons.forEach((b, i) => {
    const isLeft = /\bleft\b/.test(b.cls || "");
    if (!isLeft && i > 0 && /\bleft\b/.test(buttons[i - 1].cls || "")) { const sp = document.createElement("span"); sp.style.flex = "1"; f.appendChild(sp); }
    const el = document.createElement("button"); el.className = "btn " + (b.cls || "").replace(/\bleft\b/, ""); el.textContent = b.l; el.onclick = b.fn; f.appendChild(el);
  });
  f.style.display = buttons.length ? "flex" : "none";
  $("modalBg").classList.add("open");
}
function closeModal() { quickOpen = false; closeModalInner(); }
function closeModalInner() { $("modalBg").classList.remove("open"); }
function openForm(title, fields, obj, onSave, extraBtns = [], extraHtml = "") {
  const body = `<div class="form" id="fForm">` + fields.map((f) => {
    const v = obj[f.k] !== undefined && obj[f.k] !== null && obj[f.k] !== "" ? obj[f.k] : f.v ?? "";
    let input;
    if (f.t === "textarea") input = `<textarea data-k="${f.k}" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>`;
    else if (f.t === "select") input = `<select data-k="${f.k}">${f.opts.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
    else if (f.t === "multi") input = f.opts.length ? `<select multiple data-k="${f.k}" data-multi="1">${f.opts.map(([ov, ol]) => `<option value="${ov}" ${(v || []).includes(ov) ? "selected" : ""}>${esc(ol)}</option>`).join("")}</select>` : `<div class="muted small">(등록된 항목 없음)</div>`;
    else if (f.t === "check") return `<div class="full"><label class="check"><input type="checkbox" data-k="${f.k}" data-check="1" ${v ? "checked" : ""}> ${esc(f.l)}</label></div>`;
    else input = `<input type="${f.t}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || "")}"${f.list ? ` list="dl_${f.k}"` : ""}>${f.list ? `<datalist id="dl_${f.k}">${f.list.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>` : ""}`;
    return `<div class="${f.full ? "full" : ""}"><label>${esc(f.l)}${f.req ? " *" : ""}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
  }).join("") + `</div>` + extraHtml;
  openModal(title, body, [...extraBtns, { l: "취소", fn: closeModal }, { l: "저장", cls: "primary", fn: () => {
    const v = {};
    fields.filter((f) => f.t === "multi").forEach((f) => (v[f.k] = []));
    document.querySelectorAll("#fForm [data-k]").forEach((el) => {
      v[el.dataset.k] = el.dataset.multi ? [...el.selectedOptions].map((o) => o.value) : el.dataset.check ? el.checked : el.value.trim();
    });
    const miss = fields.find((f) => f.req && !v[f.k]);
    if (miss) { toast(`${miss.l} 입력 필요`); return; }
    if (onSave(v) !== false) { if ($("modalTitle").textContent === title) closeModal(); }
  } }], fields.length > 9);
  setTimeout(() => document.querySelector("#fForm [data-k]")?.focus(), 30);
}

// ───────────── boot ─────────────
document.addEventListener("mousedown", (e) => { if (!e.target.closest(".gsearch")) $("gres").classList.remove("open"); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.code === "KeyS" || e.key.toLowerCase() === "s")) { e.preventDefault(); saveFile(false); }
  if ((e.ctrlKey || e.metaKey) && (e.code === "KeyK" || e.key.toLowerCase() === "k")) { e.preventDefault(); $("gq").focus(); $("gq").select(); }
  if (e.key === "Escape" && $("modalBg").classList.contains("open")) closeModal();
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if (!inField && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const open = $("modalBg").classList.contains("open");
    if (!open && (e.code === "KeyC" || e.key.toLowerCase() === "c" || e.key === "ㅊ")) { e.preventDefault(); quickCreate(); return; }
    if (open && quickOpen && $("modalTitle").textContent === "만들기" && /^[1-8]$/.test(e.key)) { e.preventDefault(); closeModal(); QUICK[Number(e.key) - 1][3](); return; }
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.code === "KeyZ" || e.key.toLowerCase() === "z") && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) { e.preventDefault(); undo(); }
});
window.addEventListener("beforeunload", (e) => { if (fileHandle && dirty) { e.preventDefault(); e.returnValue = ""; } });
load();
lastJson = snapshot(); lastCount = itemCount();
restoreHandle();
setTimeout(() => checkNotify(), 3000);
let lastTick = { date: today(), n: computeAlerts(null).length };
function tick() {
  checkNotify();
  const a = document.activeElement, typing = a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  const pendingPaste = $("mailPaste") && $("mailPaste").value.trim();
  if (document.hidden || typing || pendingPaste || $("modalBg").classList.contains("open")) return;
  const now = { date: today(), n: computeAlerts(null).length };
  if (now.date !== lastTick.date || now.n !== lastTick.n) { lastTick = now; render(); }
}
setInterval(tick, 30 * 60 * 1000);   // 열어 둔 채로 날짜·경고가 바뀌면 갱신 (입력 중엔 건너뜀)
render();
</script>
