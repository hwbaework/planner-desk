<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Desk · 기획 데스크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='14' y='17' width='36' height='32' rx='5' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M14 27h36M24 12v9M40 12v9' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M24 38l5 5 10-10' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8f9; --panel: #ffffff; --sub: #f1f2f4; --hover: #f7f8f9;
    --line: #dcdfe4; --line2: #b3b9c4;
    --text: #172b4d; --dim: #44546f; --faint: #626f86;
    --accent: #0c66e4; --accentw: #e9f2ff;
    --danger: #ae2e24; --dangerw: #ffeceb;
    --warn: #a54800; --warnw: #fff7d6;
    --ok: #216e4e; --okw: #dcfff1;
    --violet: #5e4db2; --violetw: #f3f0ff;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d2125; --panel: #22272b; --sub: #2c333a; --hover: #282e33;
    --line: #38414a; --line2: #454f59;
    --text: #dee4ea; --dim: #b6c2cf; --faint: #8c9bab;
    --accent: #579dff; --accentw: #1c2b41;
    --danger: #ff6b60; --dangerw: #3a1b19;
    --warn: #f0b54a; --warnw: #352a12;
    --ok: #4fd28a; --okw: #123122;
    --violet: #a08bff; --violetw: #2a2346;
    --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.55;
  }
  a { color: var(--accent); }
  button { font-family: inherit; }

  /* ── Top bar ── */
  .top {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
  .brand small { font-weight: 500; color: var(--faint); margin-left: 6px; font-size: 12px; }
  .today { color: var(--dim); font-size: 12px; }
  .top .spacer { flex: 1; }
  .save-ind { font-size: 12.5px; color: var(--faint); }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; flex: none; }
  .btn .ico + span { margin-left: 6px; }
  .btn.icon { padding: 7px 8px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 26px; height: 26px; }
  .save-ind.dirty { color: var(--warn); }

  .btn {
    border: 1px solid var(--line2); background: var(--panel); color: var(--text);
    padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--sub); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.sm { padding: 4px 9px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--dim); }
  .btn.ghost:hover { background: var(--sub); color: var(--text); }

  /* ── Shell ── */
  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: calc(100vh - 53px); }
  .side { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 10px; }
  .side h3 { font-size: 11px; color: var(--faint); font-weight: 600; letter-spacing: .4px; margin: 4px 8px 8px; }
  .proj {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; color: var(--dim);
  }
  .proj:hover { background: var(--sub); color: var(--text); }
  .proj.active { background: var(--accentw); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 6px 6px 0; }
  .proj .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); flex: none; }
  .cnt { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--dangerw); color: var(--danger); font-weight: 700; }
  .side .add { margin: 10px 8px 0; width: calc(100% - 16px); }
  .side .archived { margin-top: 16px; }

  main { padding: 16px 22px 60px; min-width: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tab {
    border: none; background: none; padding: 10px 15px; color: var(--dim); cursor: pointer; font-size: 14.5px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
  .tab .cnt { margin-left: 5px; }

  .page-head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .page-head h2 { font-size: 20px; letter-spacing: -.3px; }
  .page-head .meta { color: var(--dim); font-size: 13.5px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .card-h h3 { font-size: 15px; }
  .card-h .sub { color: var(--faint); font-size: 13px; }
  .card-h .actions { margin-left: auto; display: flex; gap: 6px; }
  .card-b { padding: 12px 14px; }
  .empty { color: var(--faint); padding: 18px 14px; text-align: center; font-size: 12.5px; }

  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); }
  .kpi:hover { border-color: var(--line2); }
  .kpi .l { font-size: 13.5px; color: var(--dim); font-weight: 500; }
  .kpi .v { font-size: 28px; font-weight: 700; margin-top: 2px; letter-spacing: -.5px; }
  .kpi .h { font-size: 12.5px; color: var(--faint); }
  .kpi.danger .v { color: var(--danger); }
  .kpi.warn .v { color: var(--warn); }
  .kpi.ok .v { color: var(--ok); }

  .grid2 { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 14px; }

  /* Phase stepper */
  .phases { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
  .ph { border-radius: 8px; padding: 9px 10px; color: #fff; position: relative; min-height: 76px; }
  .ph .t { font-size: 11px; opacity: .85; font-weight: 600; }
  .ph .n { font-size: 13px; font-weight: 700; }
  .ph .p { font-size: 11.5px; margin-top: 6px; opacity: .95; }
  .ph .bar { height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .ph .bar i { display: block; height: 100%; background: #fff; }
  .ph.cur { outline: 3px solid var(--text); outline-offset: 1px; }
  .ph.cur::after { content: "현재"; position: absolute; top: 7px; right: 8px; font-size: 10px; background: rgba(255,255,255,.25); padding: 0 5px; border-radius: 4px; }

  /* Tables */
  .tbl-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th {
    text-align: left; font-weight: 600; color: var(--dim); font-size: 12.5px; background: var(--sub);
    padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0;
  }
  table.t td { padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr:hover td { background: var(--hover); }
  table.t tr:last-child td { border-bottom: none; }
  table.t .link { cursor: pointer; font-weight: 600; }
  table.t .link:hover { color: var(--accent); text-decoration: underline; }
  td.nowrap, th.nowrap { white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: Consolas, "D2Coding", monospace; font-size: 13px; }
  .muted { color: var(--faint); }
  .clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .small { font-size: 12.5px; }

  .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .b-gray { background: var(--sub); color: var(--dim); }
  .b-blue { background: var(--accentw); color: var(--accent); }
  .b-violet { background: var(--violetw); color: var(--violet); }
  .b-green { background: var(--okw); color: var(--ok); }
  .b-amber { background: var(--warnw); color: var(--warn); }
  .b-red { background: var(--dangerw); color: var(--danger); }
  .b-muted { background: transparent; color: var(--faint); border: 1px dashed var(--line2); }
  .chip-ref { display: inline-block; font-size: 12px; padding: 0 6px; border: 1px solid var(--line2); border-radius: 4px; color: var(--dim); margin: 2px 3px 0 0; }

  select.inline {
    width: auto; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 3px 5px; font-size: 13px; font-family: inherit;
  }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .chip { border: 1px solid var(--line2); background: var(--panel); color: var(--dim); border-radius: 14px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip.active { background: var(--accentw); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .search { border: 1px solid var(--line2); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 9px; font-size: 12.5px; min-width: 200px; font-family: inherit; }

  /* Alerts */
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .alert:last-child { border-bottom: none; }
  .alert .ic { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
  .alert.danger .ic { background: var(--danger); }
  .alert.warn .ic { background: var(--warn); }
  .alert.mine .ic { background: var(--accent); }
  .alert .body { flex: 1; min-width: 0; }
  .alert .k { font-size: 12.5px; font-weight: 700; }
  .alert.danger .k { color: var(--danger); }
  .alert.warn .k { color: var(--warn); }
  .alert.mine .k { color: var(--accent); }
  .alert .tt { font-weight: 600; cursor: pointer; }
  .alert .tt:hover { color: var(--accent); }
  .alert .d { color: var(--dim); font-size: 13px; }
  .alert .acts { display: flex; gap: 4px; flex: none; }

  /* Methodology matrix (산출물) */
  .mx { display: grid; grid-template-columns: 210px 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
  .mx + .mx { margin-top: 10px; }
  .mx-ph { color: #fff; padding: 12px 14px; }
  .mx-ph .id { font-size: 12px; font-weight: 600; opacity: .85; }
  .mx-ph .nm { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .mx-ph ul { list-style: none; font-size: 12px; opacity: .95; }
  .mx-ph li::before { content: "▪ "; opacity: .7; }
  .mx-ph .prog { margin-top: 10px; font-size: 11.5px; }
  .mx-body { min-width: 0; }
  .mx-body .foot { padding: 6px 9px; border-top: 1px solid var(--line); }

  /* Timeline */
  .tl { list-style: none; position: relative; margin-left: 6px; }
  .tl li { position: relative; padding: 0 0 12px 18px; border-left: 2px solid var(--line); }
  .tl li:last-child { border-left-color: transparent; }
  .tl li::before { content: ""; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line2); }
  .tl li.resp::before { border-color: var(--ok); background: var(--okw); }
  .tl li.mine::before { border-color: var(--accent); background: var(--accentw); }
  .tl li.bad::before { border-color: var(--danger); background: var(--dangerw); }
  .tl .h { font-size: 12px; color: var(--dim); }
  .tl .h b { color: var(--text); }
  .tl .x { white-space: pre-wrap; word-break: break-word; font-size: 12.8px; margin-top: 2px; }

  /* Gantt */
  .gantt { position: relative; height: 16px; background: var(--sub); border-radius: 4px; min-width: 220px; }
  .gantt .bar { position: absolute; top: 3px; height: 10px; border-radius: 3px; opacity: .85; }
  .gantt .bar i { display: block; height: 100%; background: rgba(0,0,0,.28); border-radius: 3px 0 0 3px; }
  .gantt .todayline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--danger); }
  input.progress { width: 58px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; text-align: right; background: var(--panel); color: var(--text); font-family: inherit; font-size: 12px; }

  /* Project tag */
  .ptag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
  .ptag i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* Calendar */
  .cal-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .cal-title { font-size: 16px; min-width: 110px; text-align: center; }
  .cal-kinds { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  .cal .dow { padding: 7px 8px; font-size: 12.5px; font-weight: 600; color: var(--dim); background: var(--sub); border-bottom: 1px solid var(--line); }
  .cal .day { min-height: 112px; padding: 4px 5px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
  .cal .day:nth-child(7n) { border-right: none; }
  .cal .day:hover { background: var(--hover); }
  .cal .day.out { background: var(--sub); }
  .cal .day.out .num { color: var(--faint); }
  .cal .day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal .num { font-size: 13px; font-weight: 600; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; margin-bottom: 2px; }
  .cal .sun { color: var(--danger); }
  .cal .sat { color: var(--accent); }
  .cal .day.today .num { background: var(--accent); color: #fff; }
  .pill { font-size: 12.5px; line-height: 1.35; padding: 1px 5px; margin-top: 2px; border-radius: 3px; border-left: 3px solid var(--line2); background: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill:hover { background: var(--accentw); }
  .pill .k { color: var(--faint); font-size: 10.5px; margin-right: 4px; }
  .pill.done { text-decoration: line-through; color: var(--faint); }
  .cal .more { font-size: 11px; color: var(--dim); margin-top: 2px; padding-left: 4px; }

  /* Board (Jira 보드 구조) */
  .board-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
  .seg button { border: none; background: var(--panel); color: var(--dim); padding: 6px 12px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--accentw); color: var(--accent); font-weight: 700; }
  .lane-h { font-weight: 700; font-size: 14px; margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--sub); border-radius: 6px; padding: 8px; min-height: 160px; display: flex; flex-direction: column; gap: 6px; }
  .col.over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accentw); }
  .col-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--dim); padding: 2px 4px 4px; text-transform: uppercase; letter-spacing: .2px; }
  .col-h .n { font-weight: 600; color: var(--faint); }
  .kcard { background: var(--panel); border-radius: 4px; padding: 9px 10px; box-shadow: 0 1px 1px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.31); cursor: grab; border-left: 3px solid transparent; }
  .kcard:hover { background: var(--hover); }
  .kcard.dragging { opacity: .45; }
  .kcard .tt { font-size: 14px; line-height: 1.4; word-break: break-word; cursor: pointer; }
  .kcard .tt:hover { color: var(--accent); }
  .kcard .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .kcard .key { font-weight: 600; color: var(--faint); font-size: 12px; }
  .kcard .due { padding: 0 6px; border-radius: 3px; background: var(--sub); font-weight: 600; }
  .kcard .due.late { background: var(--dangerw); color: var(--danger); }
  .kcard .due.soon { background: var(--warnw); color: var(--warn); }
  .kcard .av { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .kcard .next { border: none; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0 2px; font-family: inherit; visibility: hidden; }
  .kcard:hover .next { visibility: visible; }
  .kcard .warnline { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--danger); }
  .col .add { border: none; background: none; text-align: left; color: var(--dim); padding: 6px 4px; border-radius: 4px; cursor: pointer; font-size: 13.5px; font-family: inherit; }
  .col .add:hover { background: var(--line); color: var(--text); }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,30,.38); display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal.wide { max-width: 900px; }
  .modal-h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 8px; }
  .modal-h h2 { font-size: 15.5px; flex: 1; }
  .modal-b { padding: 16px 18px; max-height: calc(100vh - 200px); overflow-y: auto; }
  .modal-f { display: flex; gap: 6px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
  .modal-f .left { margin-right: auto; }

  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .form .full { grid-column: 1 / -1; }
  .form label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; font-weight: 600; }
  .form .hint { font-size: 12px; color: var(--faint); margin-top: 2px; font-weight: 400; }
  input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
    width: 100%; border: 1px solid var(--line2); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accentw); border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
  select[multiple] { min-height: 110px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .check input { width: auto; }

  .info { display: grid; grid-template-columns: 110px 1fr; gap: 7px 12px; font-size: 14px; }
  .info .l { color: var(--dim); font-size: 13px; padding-top: 1px; }
  .quick { display: flex; flex-wrap: wrap; gap: 5px; margin: 14px 0 8px; }
  .evform { display: grid; grid-template-columns: 140px 140px 1fr auto; gap: 6px; align-items: start; margin-bottom: 14px; }
  .evform textarea { min-height: 38px; }
  .sec-t { font-size: 12px; font-weight: 700; color: var(--dim); margin: 14px 0 8px; }

let S;                 // 전체 상태
let fileHandle = null; // 저장 위치(File System Access API)
let fileTimer = null, lastFileSave = null, dirty = false;
let modalOnClose = null;

// ───────────── utils ─────────────
const $ = (id) => document.getElementById(id);
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pad(n) { return String(n).padStart(2, "0"); }
function fmtD(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function today() { return fmtD(new Date()); }
function parseD(s) { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function calDays(a, b = today()) { return Math.round((parseD(b) - parseD(a)) / 864e5); }
function bizDays(from, to = today()) {
  if (!from) return 0;
  const d = parseD(from), e = parseD(to); let n = 0;
  while (d < e) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
  return n;
}
function wd(s) { return "일월화수목금토"[parseD(s).getDay()]; }
function shortD(s) { return s ? s.slice(5).replace("-", "/") + `(${wd(s)})` : ""; }
function stamp() { const d = new Date(); return `${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function dday(s) {
  if (!s) return "";

  return n === 0 ? "D-day" : n > 0 ? `D-${n}` : `D+${-n}`;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 2600); }
async function copyText(text, msg = "클립보드에 복사됨") {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(msg);
}
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function badge(text, cls) { return `<span class="badge b-${cls}">${esc(text)}</span>`; }
function phase(id) { return PHASES.find((p) => p.id === id); }
function phaseColor(id) { return phase(id)?.color || "#8b93a1"; }

// ───────────── state ─────────────
function emptyState() {
  return {
    v: 1, updatedAt: null,
    settings: { me: "", sign: "", ackDays: 2, approvalDays: 3, quietDays: 5, verifyDays: 2, theme: "light", hoPrefix: "HO", fontScale: "1",
      mail: { provider: "hiworks", protocol: "pop3", host: "pop3s.hiworks.com", port: 995, user: "", folder: "INBOX", days: 14, devSenders: "", last: null } },
    ui: { tab: "dash", pid: "all", hoFilter: "open", noteId: null, taskFilter: "open", calMonth: "", calSel: "", calKinds: { event: 1, task: 1, data: 1, ho: 1, doc: 1, recur: 1, wbs: 0 }, dataFilter: "open", dataOrg: "", board: "ho", boardGroup: "none", boardQ: "" },
    seq: { ho: 0 },
    projects: [], tasks: [], events: [], recurring: [], datas: [], docs: [], handoffs: [], screens: [], wbs: [], mails: [], notes: [],
  };
}
function normalize(d) {
  const e = emptyState();
  const s = Object.assign(e, d || {});
  s.settings = Object.assign(emptyState().settings, d?.settings || {});
  s.settings.mail = Object.assign(emptyState().settings.mail, d?.settings?.mail || {});
  s.ui = Object.assign(emptyState().ui, d?.ui || {});
  s.seq = Object.assign({ ho: 0 }, d?.seq || {});
  ["projects", "tasks", "events", "recurring", "datas", "docs", "handoffs", "screens", "wbs", "mails", "notes"].forEach((k) => { if (!Array.isArray(s[k])) s[k] = []; });
  s.datas.forEach((x) => { x.log = x.log || []; });
  s.ui.calKinds = Object.assign(emptyState().ui.calKinds, d?.ui?.calKinds || {});
  s.projects.forEach((p, i) => { if (!p.color) p.color = PROJ_COLORS[i % PROJ_COLORS.length]; });

}
function load() {
  let local = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) local = JSON.parse(raw); } catch (e) {}
  if (EMBEDDED_DATA && (!local || (EMBEDDED_DATA.updatedAt || "") > (local.updatedAt || ""))) {
    S = normalize(EMBEDDED_DATA); writeLocal(); return;
  }
  if (local) {
    S = normalize(local);
    if (EMBEDDED_DATA && (EMBEDDED_DATA.updatedAt || "") < (local.updatedAt || "")) S._embeddedOlder = true;
    return;
  }

}
function writeLocal() {
  const copy = Object.assign({}, S); delete copy._embeddedOlder;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(copy)); } catch (e) { toast("브라우저 저장 실패: " + e.message); }
}
function persist() {

  if (fileHandle) { clearTimeout(fileTimer); fileTimer = setTimeout(() => writeToHandle(true), 1500); }
}
function commit() { persist(); render(); }

// ───────────── file save / load ─────────────
function buildHtml() {
  const copy = Object.assign({}, S); delete copy._embeddedOlder;
  const json = JSON.stringify(copy).replace(/</g, "\\u003c");
  return PRISTINE.replace(EMBED_RE, () => "var EMBEDDED_DATA = " + json + "; /*EMBEDDED_DATA" + "_PLACEHOLDER*/");

async function writeToHandle(silent) {
  if (!fileHandle) return false;
  try {
    const w = await fileHandle.createWritable(); await w.write(buildHtml()); await w.close();
    dirty = false; lastFileSave = new Date(); updateSaveInd();
    if (!silent) toast("저장 완료 → " + fileHandle.name);
    return true;
  } catch (e) { fileHandle = null; updateSaveInd(); toast("파일 쓰기 실패 — 다시 저장 위치를 지정해줘"); return false; }
}
async function saveFile(pick) {
  if (window.showSaveFilePicker && (pick || !fileHandle)) {
    try {
      fileHandle = await window.showSaveFilePicker({ suggestedName: `planner-desk_${stamp()}.html`, types: [{ description: "HTML", accept: { "text/html": [".html"] } }] });
    } catch (e) { if (e.name === "AbortError") return; fileHandle = null; }
  }
  if (fileHandle && (await writeToHandle(false))) return;
  download(`planner-desk_${stamp()}.html`, buildHtml(), "text/html");
  dirty = false; lastFileSave = new Date(); updateSaveInd();
  toast("백업 HTML 다운로드 — 그 파일을 열면 지금 데이터 그대로 열림");
}
function updateSaveInd() {
  const el = $("saveInd"); if (!el) return;
  const t = lastFileSave ? lastFileSave.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : null;
  if (fileHandle) { el.className = "save-ind" + (dirty ? " dirty" : ""); el.textContent = `${fileHandle.name} · ${dirty ? "저장 대기…" : "자동저장 " + t}`; }
  else { el.className = "save-ind" + (dirty ? " dirty" : ""); el.textContent = dirty ? "브라우저에 저장됨 · 파일 미저장" : t ? `파일 저장 ${t}` : "브라우저에 자동 저장 중"; }
}
function importFile(ev) {

  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const txt = r.result;
      let m = txt.match(/var EMBEDDED_DATA = ([\s\S]+?); \/\*EMBEDDED_DATA_PLACEHOLDER\*\//);
      if (m && m[1].trim() !== "null") {
        const d = JSON.parse(m[1]);
        if (!confirm(`Planner Desk 백업을 불러올까?\n프로젝트 ${d.projects?.length || 0}개 · 전달 ${d.handoffs?.length || 0}건 · 산출물 ${d.docs?.length || 0}건\n현재 데이터는 덮어씌워져.`)) return;
        S = normalize(d); commit(); toast("불러오기 완료"); return;
      }
      m = txt.match(/var EMBEDDED_BACKUP_DATA = ([\s\S]+?); \/\*EMBEDDED_BACKUP_PLACEHOLDER\*\//);
      if (m && m[1].trim() !== "null") { importLegacy(JSON.parse(m[1])); return; }
      const d = JSON.parse(txt);
      if (Array.isArray(d.mails) && !d.projects) { importMailJson(d); return; }
      if (d.tasks && !d.handoffs) { importLegacy(d); return; }
      if (!confirm("JSON 데이터를 불러올까? 현재 데이터는 덮어씌워져.")) return;
      S = normalize(d); commit(); toast("불러오기 완료");
    } catch (e) { alert("불러오기 실패: " + e.message); }
  };
  r.readAsText(f, "utf-8");
}
// 기존 '사업관리 대시보드' 백업 → 프로젝트/WBS(업무)/메모로 합치기
function importLegacy(d) {
  const ps = (d.projects || []).filter((p) => p.name);
  const ts = Array.isArray(d) ? d : d.tasks || [];
  const ns = d.notes || [];
  if (!confirm(`기존 사업관리 대시보드 백업을 '추가'로 가져올까?\n프로젝트 ${ps.length}개 · 업무 ${ts.length}개 · 일정 ${(d.events || []).length}개 · 정기 ${(d.recurring || []).length}개 · 메모 ${ns.length}개\n현재 데이터는 유지돼.`)) return;
  const byName = {};
  S.projects.forEach((p) => (byName[p.name] = p.id));
  const ensure = (name) => {
    name = name || "기타";
    if (!byName[name]) { const p = { id: uid("p"), name, client: "", start: "", end: "", memo: "기존 대시보드에서 가져옴", archived: false, color: PROJ_COLORS[S.projects.length % PROJ_COLORS.length] }; S.projects.push(p); byName[name] = p.id; }
    return byName[name];
  };
  ps.forEach((p) => { const id = ensure(p.name); if (p.archived) S.projects.find((x) => x.id === id).archived = true; });
  ts.forEach((t) => S.tasks.push(legacyTask(t, ensure(t.project))));
  const linked = new Set(ts.map((t) => t.calendarEventId).filter(Boolean));   // 업무에서 만든 캘린더 일정은 업무 마감으로 이미 표시됨
  (d.events || []).filter((e) => !linked.has(e.id)).forEach((e) => S.events.push(legacyEvent(e, ensure(e.project))));
  (d.recurring || []).forEach((r) => S.recurring.push(legacyRecur(r, ensure(r.project))));
  ns.forEach((n) => S.notes.push({ id: uid("n"), projectId: ensure(n.project), title: n.title || "", date: n.date || today(), content: n.content || "", updatedAt: new Date().toISOString() }));
  commit(); toast("기존 데이터 가져오기 완료");
}

function legacyTask(t, pid) {
  return { id: uid("t"), projectId: pid, title: t.title || "(제목 없음)", status: TASK_ST.includes(t.status) ? t.status : "진행중",
    priority: { high: "high", medium: "mid", low: "low" }[t.priority] || "mid", start: t.awarenessDate || (t.createdAt || "").slice(0, 10),
    due: t.due || "", owner: t.owner || "", memo: t.notes || "", updatedAt: t.updatedAt || "" };
}
function legacyEvent(e, pid) {
  return { id: uid("ev"), projectId: pid, title: e.title || "", type: EVENT_TYPES.includes(e.type) ? e.type : "기타", start: e.startDate || "", end: e.endDate || "", location: e.location || "", memo: e.notes || "" };
}
function legacyRecur(r, pid) {
  return { id: uid("r"), projectId: pid, title: r.title || "", freq: r.recurType === "monthly" ? "monthly" : "weekly", day: Number(r.recurDay) || 0,
    nextDue: r.nextDue || "", recipient: r.recipient || "", path: r.filePath || "", memo: r.notes || "", lastDone: r.lastCompleted || "", history: (r.history || []).map((h) => h.date) };
}

// ───────────── domain helpers ─────────────
function proj(id) { return S.projects.find((p) => p.id === id); }
function projName(id) { return proj(id)?.name || "-"; }
function projColor(id) { return proj(id)?.color || "#8b93a1"; }
function projTag(id) { return `<span class="ptag"><i style="background:${projColor(id)}"></i>${esc(projName(id))}</span>`; }
function activeProjects() { return S.projects.filter((p) => !p.archived); }
function inScope(x) { return S.ui.pid === "all" ? !proj(x.projectId)?.archived : x.projectId === S.ui.pid; }
function ackDaysOf(pid) { const p = proj(pid); return Number(p?.ackDays) || Number(S.settings.ackDays) || 2; }
function hoStLabel(s) { return (HO_ST.find((x) => x[0] === s) || [s, s])[1]; }
function evLabel(t) { return (EV_TYPES.find((x) => x[0] === t) || [t, t])[1]; }
function lastEvent(h, types) { return [...h.events].filter((e) => !types || types.includes(e.type)).sort((a, b) => (a.at + (a.ts || "")).localeCompare(b.at + (b.ts || ""))).pop(); }
function isOpenHO(h) { return h.status !== "verified" && h.status !== "hold"; }

function applyTemplate(p) {
  PHASES.forEach((ph) => {
    ph.docs.forEach((name, i) => S.docs.push({ id: uid("d"), projectId: p.id, phase: ph.id, name, status: "미착수", version: "v0.1", owner: "", plan: "", requestedAt: "", approvedAt: "", approver: "", path: "", memo: "", history: [], order: i }));
    ph.acts.forEach((title) => S.wbs.push({ id: uid("w"), projectId: p.id, phase: ph.id, title, owner: "", start: "", end: "", progress: 0, memo: "" }));
  });
}

// 확인 필요 항목(노티 미수신, 승인 회신 없음, 일정 지연 등)
function computeAlerts(pid) {
  const out = [], t = today(), st = S.settings;
  const scope = (x) => (pid ? x.projectId === pid : !proj(x.projectId)?.archived);
  S.handoffs.filter(scope).forEach((h) => {
    if (!isOpenHO(h)) return;
    const lastResp = lastEvent(h, RESP_EV);
    const ackLimit = ackDaysOf(h.projectId);
    if (h.status === "sent" && h.sentAt) {
      const bd = bizDays(h.sentAt);
      if (bd > ackLimit) out.push({ level: "danger", kind: "접수 노티 없음", ref: ["ho", h.id], pid: h.projectId, days: bd, title: `[${h.code}] ${h.title}`, desc: `${h.to || "수신자"}에게 ${shortD(h.sentAt)} 전달 후 영업일 ${bd}일째 회신 없음 (기준 ${ackLimit}일)` });
    }
    if (["sent", "ack", "dev"].includes(h.status) && h.dueDate && h.dueDate < t) {
      out.push({ level: "danger", kind: "완료 노티 없음", ref: ["ho", h.id], pid: h.projectId, days: calDays(h.dueDate), title: `[${h.code}] ${h.title}`, desc: `완료 예정 ${shortD(h.dueDate)} 경과 (${dday(h.dueDate)}) · 현재 ${hoStLabel(h.status)}` });
    } else if (["ack", "dev"].includes(h.status)) {
      const base = lastResp?.at || h.sentAt;
      const bd = bizDays(base);
      if (bd > Number(st.quietDays)) out.push({ level: "warn", kind: "진행 공유 없음", ref: ["ho", h.id], pid: h.projectId, days: bd, title: `[${h.code}] ${h.title}`, desc: `마지막 응답 ${shortD(base)} 이후 영업일 ${bd}일 무소식` });
    }
    if (h.status === "done") {
      const de = lastEvent(h, ["done"]);
      const bd = bizDays(de?.at || t);
      if (bd >= Number(st.verifyDays)) out.push({ level: "mine", kind: "내 검수 대기", ref: ["ho", h.id], pid: h.projectId, days: bd, title: `[${h.code}] ${h.title}`, desc: `완료 노티 ${shortD(de?.at)} 받음 → 기획 검수 필요 (${bd}일 경과)` });
    }
  });
  S.docs.filter(scope).forEach((d) => {
    if (d.status === "검토요청" && d.requestedAt) {
      const bd = bizDays(d.requestedAt);
      if (bd > Number(st.approvalDays)) out.push({ level: "danger", kind: "승인 회신 없음", ref: ["doc", d.id], pid: d.projectId, days: bd, title: d.name, desc: `${shortD(d.requestedAt)} 검토요청 후 영업일 ${bd}일 · 승인자 ${d.approver || "미지정"}` });
    }
    if (d.plan && d.plan < t && !["승인", "해당없음", "검토요청"].includes(d.status)) {
      out.push({ level: "warn", kind: "산출물 일정 지연", ref: ["doc", d.id], pid: d.projectId, days: calDays(d.plan), title: `${d.phase} ${d.name}`, desc: `계획 ${shortD(d.plan)} (${dday(d.plan)}) · ${d.status}` });
    }
  });
  S.wbs.filter(scope).forEach((w) => {
    if (w.end && w.end < t && Number(w.progress) < 100) out.push({ level: "warn", kind: "WBS 지연", ref: ["wbs", w.id], pid: w.projectId, days: calDays(w.end), title: w.title, desc: `종료 ${shortD(w.end)} (${dday(w.end)}) · 진척 ${w.progress || 0}%` });
  });
  S.tasks.filter(scope).forEach((x) => {
    if (x.status !== "완료" && x.due && x.due < t) out.push({ level: "warn", kind: "업무 마감 지남", ref: ["task", x.id], pid: x.projectId, days: calDays(x.due), title: x.title, desc: `마감 ${shortD(x.due)} (${dday(x.due)}) · ${x.status}${x.owner ? " · " + x.owner : ""}` });
  });
  S.datas.filter(scope).forEach((x) => {
    if (["합의", "수신 중"].includes(x.status) && x.dueDate && x.dueDate < t && !(x.lastReceivedAt && x.lastReceivedAt >= x.dueDate))
      out.push({ level: "danger", kind: "데이터 미수신", ref: ["data", x.id], pid: x.projectId, days: calDays(x.dueDate), title: x.name, desc: `${x.org || "제공 기관"} · 수신 예정 ${shortD(x.dueDate)} (${dday(x.dueDate)}) 지남${x.contact ? " · " + x.contact : ""}` });
    else if (x.status === "협의 중") {
      const last = [...x.log].sort((a, b) => a.at.localeCompare(b.at)).pop()?.at || x.requestedAt;
      const bd = last ? bizDays(last) : 0;
      if (bd > Number(st.quietDays)) out.push({ level: "warn", kind: "데이터 협의 지연", ref: ["data", x.id], pid: x.projectId, days: bd, title: x.name, desc: `${x.org || "제공 기관"} · 마지막 협의 ${shortD(last)} 이후 영업일 ${bd}일` });
    }
  });
  S.recurring.filter(scope).forEach((r) => {
    if (r.nextDue && r.nextDue < t) out.push({ level: "warn", kind: "정기 업무 지남", ref: ["recur", r.id], pid: r.projectId, days: calDays(r.nextDue), title: r.title, desc: `예정 ${shortD(r.nextDue)} (${dday(r.nextDue)}) · 완료 처리 안 됨` });
  });
  const rank = { danger: 0, mine: 1, warn: 2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level] || b.days - a.days);
}

function currentPhase(pid) {
  const t = today();
  const ws = S.wbs.filter((w) => w.projectId === pid && w.phase && w.start && w.end && w.start <= t && t <= w.end);
  if (ws.length) return ws.map((w) => w.phase).sort()[0];
  for (const ph of PHASES) {
    const ds = S.docs.filter((d) => d.projectId === pid && d.phase === ph.id && d.status !== "해당없음");
    if (ds.some((d) => d.status !== "승인")) return ph.id;
  }
  return null;
}
function docStats(pid, phId) {
  const ds = S.docs.filter((d) => d.projectId === pid && (!phId || d.phase === phId) && d.status !== "해당없음");
  return { total: ds.length, ok: ds.filter((d) => d.status === "승인").length, req: ds.filter((d) => d.status === "검토요청").length, wip: ds.filter((d) => d.status === "작성중").length };
}

// ───────────── render: shell ─────────────
function render() {
  if (S.ui.pid !== "all" && !proj(S.ui.pid)) S.ui.pid = "all";
  document.documentElement.setAttribute("data-theme", S.settings.theme === "dark" ? "dark" : "light");
  document.body.style.zoom = Number(S.settings.fontScale) || 1;
  $("themeBtn").innerHTML = S.settings.theme === "dark"
    ? '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
    : '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
  $("todayLabel").textContent = `오늘 ${today()} (${wd(today())})`;
  renderBanner(); renderSide(); renderTabs();
  const v = { dash: renderDash, board: renderBoard, cal: renderCal, tasks: renderTasks, data: renderData, ho: renderHO, docs: renderDocs, screens: renderScreens, wbs: renderWBS, mail: renderMail, notes: renderNotes }[S.ui.tab] || renderDash;
  $("view").innerHTML = v();
  if (S.ui.tab === "mail") bindDrop();

  updateSaveInd();
}
function renderBanner() {

  if (S._embeddedOlder) h += `<div class="banner">이 HTML 파일에 내장된 데이터(${(EMBEDDED_DATA.updatedAt || "").slice(0, 16).replace("T", " ")})보다 브라우저에 더 최근 데이터가 있어서 브라우저 데이터를 열었어.
    <button class="btn sm" onclick="useEmbedded()">파일 데이터로 열기</button><button class="btn sm ghost" onclick="S._embeddedOlder=false;render()">닫기</button></div>`;
  $("bannerArea").innerHTML = h;
}
function useEmbedded() { if (!confirm("브라우저의 현재 데이터를 이 파일 내장 데이터로 바꿀까?")) return; S = normalize(EMBEDDED_DATA); commit(); }
function renderSide() {

  }).join("");
}
function selProject(id) { S.ui.pid = id; persistUI(); render(); }
function selTab(k) { S.ui.tab = k; persistUI(); render(); }
function persistUI() { writeLocal(); }
function pageHead(title, meta, actions = "") {

}

// ───────────── 대시보드 ─────────────
function renderDash() {
  const pid = S.ui.pid === "all" ? null : S.ui.pid;

  const docs = S.docs.filter(inScope);

  const openHo = hos.filter(isOpenHO).length;
  const reqDocs = docs.filter((d) => d.status === "검토요청").length;
  const mine = alerts.filter((a) => a.level === "mine").length;
  const openTasks = S.tasks.filter((x) => inScope(x) && x.status !== "완료").length;
  let h = "";
  if (pid) {
    const p = proj(pid);
    const span = p.start || p.end ? `${p.start || "?"} ~ ${p.end || "?"}${p.end ? ` · 종료 ${dday(p.end)}` : ""}` : "기간 미입력";

    h += pageHead("전체 프로젝트 현황", `진행 프로젝트 ${activeProjects().length}개`, `<button class="btn primary" onclick="editProject()">＋ 프로젝트</button>`);
  }
  h += `<div class="kpis">
    <div class="kpi danger" onclick="S.ui.hoFilter='alert';selTab('ho')"><div class="l">노티 미수신</div><div class="v">${noNoti}</div><div class="h">접수/완료 회신 기준 초과</div></div>
    <div class="kpi" onclick="S.ui.hoFilter='open';selTab('ho')"><div class="l">진행 중 개발 전달</div><div class="v">${openHo}</div><div class="h">검수완료 전 건</div></div>
    <div class="kpi warn" onclick="selTab('docs')"><div class="l">승인 대기 산출물</div><div class="v">${reqDocs}</div><div class="h">검토요청 상태</div></div>
    <div class="kpi ok" onclick="S.ui.hoFilter='done';selTab('ho')"><div class="l">내 검수 대기</div><div class="v">${mine}</div><div class="h">완료 노티 받은 건</div></div>
    <div class="kpi" onclick="S.ui.taskFilter='open';selTab('tasks')"><div class="l">진행 중 업무</div><div class="v">${openTasks}</div><div class="h">완료 전 업무</div></div>
  </div>`;

  if (pid) {
    const cur = currentPhase(pid);
    h += `<div class="card"><div class="card-h"><h3>수행방법론 진척</h3><span class="sub">단계별 산출물 승인 현황</span><div class="actions"><button class="btn sm" onclick="selTab('docs')">산출물 관리</button></div></div><div class="card-b"><div class="phases">` +
      PHASES.map((ph) => {
        const s = docStats(pid, ph.id); const pct = s.total ? Math.round((s.ok / s.total) * 100) : 0;
        return `<div class="ph ${cur === ph.id ? "cur" : ""}" style="background:${ph.color}"><div class="t">P.${ph.id.slice(1)}</div><div class="n">${ph.name}</div>
          <div class="p">승인 ${s.ok}/${s.total}${s.req ? ` · 검토 ${s.req}` : ""}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
      }).join("") + `</div></div></div>`;
  } else {

function boardDrop(ev, col) {

    else if (col === "plan" || col === "hold") { h.events.push({ id: uid("e"), at: today(), ts: new Date().toISOString(), type: "note", text: `상태 → ${hoStLabel(col)}` }); h.status = col; }
    else pushEvent(h, { type: { ack: "ack", dev: "progress", done: "done", verified: "verified" }[col], at: today(), text: "보드에서 이동" });
    commit(); toast(`[${h.code}] ${hoStLabel(col)}`);

function boardAdd(col) {

  const pid = S.ui.pid !== "all" ? S.ui.pid : activeProjects()[0].id;
  if (bk === "ho") {
    if (col === "plan") {
      const title = prompt("기획 건 제목 (예: 회원가입 화면설계)"); if (!title) return;
      S.handoffs.push({ id: uid("h"), code: nextHOCode(), projectId: pid, title, status: "plan", events: [], docIds: [], screenIds: [], priority: "mid", sentAt: "", to: "", toEmail: "", cc: "", link: "", memo: "" });

  else if (bk === "docs") editDoc(null, "P1");

}

// ───────────── 캘린더 ─────────────
// 기간 안의 표시 항목: 일정 · 업무 마감 · 개발 완료예정 · 산출물 계획 · 정기 업무 · WBS
function calItems(from, to, pid, kinds = S.ui.calKinds) {
  const out = [], inR = (d) => d && d >= from && d <= to;
  const sc = (x) => (pid ? x.projectId === pid : !proj(x.projectId)?.archived);
  const add = (date, kind, title, x, click, extra = {}) => out.push(Object.assign({ date, kind, title, pid: x.projectId, click }, extra));
  if (kinds.event) S.events.filter(sc).forEach((e) => {
    if (!e.start) return;
    const end = e.end && e.end > e.start ? e.end : e.start;
    for (let d = e.start > from ? e.start : from; d <= end && d <= to; d = addDays(d, 1)) add(d, "event", e.title, e, `editEvent('${e.id}')`, { sub: e.type });
  });
  if (kinds.data) S.datas.filter(sc).forEach((x) => { if (inR(x.dueDate) && x.status !== "보류") add(x.dueDate, "data", `${x.name}${x.org ? " · " + x.org : ""}`, x, `openData('${x.id}')`, { done: x.status === "수신 완료" }); });
  if (kinds.task) S.tasks.filter(sc).forEach((t) => { if (inR(t.due)) add(t.due, "task", t.title, t, `editTask('${t.id}')`, { done: t.status === "완료" }); });
  if (kinds.ho) S.handoffs.filter(sc).forEach((h) => { if (inR(h.dueDate) && h.status !== "hold") add(h.dueDate, "ho", `[${h.code}] ${h.title}`, h, `openHO('${h.id}')`, { done: ["done", "verified"].includes(h.status) }); });
  if (kinds.doc) S.docs.filter(sc).forEach((d) => { if (inR(d.plan) && d.status !== "해당없음") add(d.plan, "doc", d.name, d, `editDoc('${d.id}')`, { done: d.status === "승인" }); });
  if (kinds.recur) S.recurring.filter(sc).forEach((r) => recurDates(r, from, to).forEach((d) => add(d, "recur", r.title, r, `editRecur('${r.id}')`)));
  if (kinds.wbs) S.wbs.filter(sc).forEach((w) => {
    if (inR(w.start)) add(w.start, "wbs", "시작 " + w.title, w, `editWBS('${w.id}')`);
    if (inR(w.end) && w.end !== w.start) add(w.end, "wbs", "종료 " + w.title, w, `editWBS('${w.id}')`, { done: Number(w.progress) >= 100 });
  });
  const order = { event: 0, recur: 1, task: 2, data: 3, ho: 4, doc: 5, wbs: 6 };
  return out.sort((a, b) => a.date.localeCompare(b.date) || order[a.kind] - order[b.kind]);
}
function renderCal() {

  const start = fmtD(new Date(y, m - 1, 1 - first.getDay()));
  const byDay = {};

  const t = today(), sel = S.ui.calSel || t;

    <button class="btn sm ghost" onclick="S.ui.calMonth='';S.ui.calSel='';render()">오늘</button>
    <span class="cal-kinds">${CAL_KINDS.map(([k, l]) => `<label class="check small"><input type="checkbox" ${S.ui.calKinds[k] ? "checked" : ""} onchange="S.ui.calKinds.${k}=this.checked?1:0;persistUI();render()">${l}</label>`).join("")}</span></div>`;
  if (!pid) h += `<div class="filters">${activeProjects().map((p) => `<button class="chip" onclick="selProject('${p.id}')" title="이 프로젝트만 보기">${projTag(p.id)}</button>`).join("")}</div>`;
  h += `<div class="cal">` + [..."일월화수목금토"].map((d, i) => `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("");
  for (let i = 0; i < rows * 7; i++) {

      <div class="num ${dt.getDay() === 0 ? "sun" : dt.getDay() === 6 ? "sat" : ""}">${dt.getDate()}</div>` +

  }
  h += `</div>`;
  const selItems = calItems(sel, sel, pid);

      <div class="actions"><button class="btn sm" onclick="editEvent(null,'${sel}')">+ 일정</button><button class="btn sm" onclick="editTask(null,{due:'${sel}'})">+ 업무</button></div></div>${itemList(selItems, false)}</div>
    <div class="card"><div class="card-h"><h3>다가오는 14일</h3></div>${upcomingList(pid, 14)}</div></div>`;
  return h;
}
function calPill(i) {

  const avg = ws.length ? Math.round(ws.reduce((a, w) => a + Number(w.progress || 0), 0) / ws.length) : 0;

function normDate(s) {
  if (!s) return "";
  let m = String(s).match(/(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = String(s).match(/^(\d{1,2})[./-](\d{1,2})$/);
  if (m) return `${new Date().getFullYear()}-${pad(m[1])}-${pad(m[2])}`;
  return "";
}

function bindDrop() {

  z.ondragover = (e) => { e.preventDefault(); z.classList.add("over"); };

function readEmlFiles(files) {
  const arr = [...files]; if (!arr.length) return;
  let n = 0;
  arr.forEach((f) => {
    if (/\.msg$/i.test(f.name)) { toast(".msg(Outlook 형식)는 아직 못 읽어 — 본문 복사 붙여넣기로 해줘"); return; }

    r.onload = () => { queueMail(parseEml(r.result)); if (++n === arr.length) { commit(); toast(`${n}통 분석됨`); } };
    r.readAsText(f);
  });
}

function matchHandoff(m) {
  const text = `${m.subject}\n${m.body}`;
  const prefix = (S.settings.hoPrefix || "HO").replace(/[^A-Za-z]/g, "");
  const cm = text.match(new RegExp(`\\b(${prefix}-\\d{2,4})\\b`, "i"));
  if (cm) { const h = S.handoffs.find((x) => x.code.toUpperCase() === cm[1].toUpperCase()); if (h) return { h, why: "코드 " + h.code }; }
  const em = ((m.from || "").match(/[\w.+-]+@[\w.-]+/) || [""])[0].toLowerCase();
  const subj = (m.subject || "").replace(/^(re|fw|fwd|회신|전달|답장)\s*:\s*/gi, "").toLowerCase();
  let best = null, score = 0;
  S.handoffs.filter(isOpenHO).forEach((h) => {
    let s = 0;
    if (em && (h.toEmail || "").toLowerCase().includes(em)) s += 2;
    const toks = h.title.toLowerCase().split(/[\s,·/()\[\]-]+/).filter((w) => w.length >= 2);
    const hit = toks.filter((w) => subj.includes(w)).length;
    s += Math.min(3, hit);
    if (s > score) { score = s; best = h; }
  });
  return score >= 2 ? { h: best, why: em && (best.toEmail || "").toLowerCase().includes(em) ? "보낸 사람·제목" : "제목 유사" } : null;
}
function parseKDate(s) {

}
function parseOutlookText(t) {
  const lines = t.replace(/\r/g, "").split("\n");
  const hd = {}; let i = 0, sawHeader = false;
  const keys = { from: /^(보낸 ?사람|From|발신자?)\s*:\s*(.*)$/i, date: /^(보낸 ?날짜|날짜|Sent|Date|발신일시?)\s*:\s*(.*)$/i, subject: /^(제목|Subject)\s*:\s*(.*)$/i, to: /^(받는 ?사람|To|수신자?|참조|Cc)\s*:\s*(.*)$/i };
  for (; i < Math.min(lines.length, 14); i++) {
    const l = lines[i].trim(); if (!l) { if (sawHeader && hd.subject !== undefined) { i++; break; } continue; }
    let hit = false;
    for (const [k, re] of Object.entries(keys)) { const m = l.match(re); if (m) { if (hd[k] === undefined) hd[k] = m[2].trim(); hit = sawHeader = true; break; } }
    if (!hit && sawHeader) break;
    if (!hit && !sawHeader) { if (hd.subject === undefined) hd.subject = l; sawHeader = true; i++; break; }
  }
  let body = lines.slice(i).join("\n");
  const cut = body.search(/\n\s*(-{2,}\s*(Original Message|원본 메시지)\s*-{2,}|보낸 ?사람\s*:|From\s*:)/i);
  if (cut > 0) body = body.slice(0, cut);
  return { from: hd.from || "", subject: hd.subject || "", date: parseKDate(hd.date), body: body.trim() };
}

function decodeWords(s) {
  return String(s || "").replace(/\?=\s+=\?/g, "?==?").replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, cs, enc, txt) => {
    try {
      let bin = enc.toUpperCase() === "B" ? atob(txt) : txt.replace(/_/g, " ").replace(/=([0-9A-Fa-f]{2})/g, (x, h) => String.fromCharCode(parseInt(h, 16)));
      return new TextDecoder(cs).decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
    } catch (e) { return m; }
  });
}
function splitMsg(raw) {
  const idx = raw.search(/\r?\n\r?\n/);
  const head = idx < 0 ? raw : raw.slice(0, idx), body = idx < 0 ? "" : raw.slice(idx).replace(/^\r?\n\r?\n/, "");
  const h = {};
  head.replace(/\r?\n[ \t]+/g, " ").split(/\r?\n/).forEach((l) => { const m = l.match(/^([\w-]+):\s*(.*)$/); if (m) { const k = m[1].toLowerCase(); if (!(k in h)) h[k] = m[2]; } });
  return { h, body };
}
function decodeBody(body, cte, charset) {
  cte = (cte || "").toLowerCase(); charset = charset || "utf-8";
  let bin;
  if (cte.includes("base64")) { try { bin = atob(body.replace(/\s+/g, "")); } catch (e) { return body; } }
  else if (cte.includes("quoted-printable")) bin = body.replace(/=\r?\n/g, "").replace(/=([0-9A-Fa-f]{2})/g, (x, h) => String.fromCharCode(parseInt(h, 16)));
  else return body;
  try { return new TextDecoder(charset).decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); } catch (e) { return bin; }
}
function partText(h, body) {
  const ct = h["content-type"] || "text/plain";
  const bm = ct.match(/boundary="?([^";]+)"?/i);

    const parts = body.split("--" + bm[1]).slice(1).filter((p) => !p.startsWith("--")).map((p) => splitMsg(p.replace(/^\r?\n/, "")));
    const pick = parts.find((p) => /text\/plain/i.test(p.h["content-type"] || "")) || parts.find((p) => /multipart/i.test(p.h["content-type"] || "")) || parts.find((p) => /text\/html/i.test(p.h["content-type"] || ""));
    return pick ? partText(pick.h, pick.body) : "";
  }
  const cs = (ct.match(/charset="?([^";]+)"?/i) || [])[1];
  let txt = decodeBody(body, h["content-transfer-encoding"], cs);
  if (/text\/html/i.test(ct)) txt = txt.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<br\s*\/?>|<\/p>|<\/div>/gi, "\n").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
  return txt;
}
function parseEml(raw) {
  const { h, body } = splitMsg(raw);
  let text = partText(h, body).replace(/\r/g, "");
  const cut = text.search(/\n\s*(-{2,}\s*(Original Message|원본 메시지)\s*-{2,}|보낸 ?사람\s*:|From\s*:|.*wrote:\s*\n|>)/i);
  if (cut > 0) text = text.slice(0, cut);
  return { from: decodeWords(h.from), subject: decodeWords(h.subject), date: parseKDate(h.date), body: text.trim() };
}

    const doneW = hos.filter((h) => h.events.some((e) => e.type === "done" && e.at >= ws));
    const verW = hos.filter((h) => h.events.some((e) => e.type === "verified" && e.at >= ws));
    const apprW = S.docs.filter((d) => d.projectId === pid && d.approvedAt && d.approvedAt >= ws);
    const al = computeAlerts(pid);
    const nextW = S.wbs.filter((w) => w.projectId === pid && Number(w.progress) < 100 && ((w.start && w.start <= nx && w.start > t) || (w.end && w.end <= nx && w.end >= t)));
    const ph = currentPhase(pid);
    const L = [];
    L.push(`■ ${p.name}${ph ? ` (현재 ${ph} ${phase(ph).name})` : ""}`);
    L.push(`1. 산출물: 승인 ${s.ok}/${s.total} · 검토요청 ${s.req} · 작성중 ${s.wip}`);
    apprW.forEach((d) => L.push(`   - 승인: ${d.name} ${d.version || ""} (${shortD(d.approvedAt)})`));
    L.push(`2. 개발 전달: 금주 전달 ${sentW.length}건 · 완료 노티 ${doneW.length}건 · 검수완료 ${verW.length}건 · 진행 중 ${hos.filter(isOpenHO).length}건`);
    sentW.forEach((h) => L.push(`   - 전달: [${h.code}] ${h.title} → ${h.to || "-"}`));
    const issues = al.filter((a) => a.level === "danger");
    L.push(`3. 이슈 / 회신 지연: ${issues.length}건`);
    issues.forEach((a) => L.push(`   - ${a.kind}: ${a.title} — ${a.desc}`));
    al.filter((a) => a.kind === "WBS 지연" || a.kind === "산출물 일정 지연").forEach((a) => L.push(`   - ${a.kind}: ${a.title} (${a.desc})`));
    L.push(`4. 차주 계획`);
    (nextW.length ? nextW : [{ title: "(WBS 일정 입력 필요)" }]).forEach((w) => L.push(`   - ${w.title}${w.end ? ` ~${shortD(w.end)}` : ""}${w.owner ? ` / ${w.owner}` : ""}`));
    return L.join("\n");
  }).join("\n\n");
  const txt = `주간 보고 (${ws} ~ ${t})\n\n` + out;
  openModal("주간보고 초안", `<textarea id="rep" class="mono" style="min-height:380px">${esc(txt)}</textarea>`, [
    { l: ".txt 저장", cls: "left", fn: () => download(`주간보고_${stamp()}.txt`, $("rep").value, "text/plain") },
    { l: "복사", cls: "primary", fn: () => copyText($("rep").value) },
  ], true);
}

// ───────────── modal / form ─────────────
function openModal(title, body, buttons = [], wide = false) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = body;
  $("modal").className = "modal" + (wide ? " wide" : "");
  const f = $("modalFoot"); f.innerHTML = "";
  buttons.forEach((b, i) => {
    const isLeft = /\bleft\b/.test(b.cls || "");
    if (!isLeft && i > 0 && /\bleft\b/.test(buttons[i - 1].cls || "")) { const sp = document.createElement("span"); sp.style.flex = "1"; f.appendChild(sp); }
    const el = document.createElement("button"); el.className = "btn " + (b.cls || "").replace(/\bleft\b/, ""); el.textContent = b.l; el.onclick = b.fn; f.appendChild(el);
  });
  f.style.display = buttons.length ? "flex" : "none";
  $("modalBg").classList.add("open");
}
function closeModal() { $("modalBg").classList.remove("open"); }
function openForm(title, fields, obj, onSave, extraBtns = [], extraHtml = "") {
  const body = `<div class="form" id="fForm">` + fields.map((f) => {
    const v = obj[f.k] !== undefined && obj[f.k] !== null && obj[f.k] !== "" ? obj[f.k] : f.v ?? "";
    let input;
    if (f.t === "textarea") input = `<textarea data-k="${f.k}" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>`;
    else if (f.t === "select") input = `<select data-k="${f.k}">${f.opts.map((o) => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? "selected" : ""}>${esc(ol)}</option>`; }).join("")}</select>`;
    else if (f.t === "multi") input = f.opts.length ? `<select multiple data-k="${f.k}" data-multi="1">${f.opts.map(([ov, ol]) => `<option value="${ov}" ${(v || []).includes(ov) ? "selected" : ""}>${esc(ol)}</option>`).join("")}</select>` : `<div class="muted small">(등록된 항목 없음)</div>`;
    else if (f.t === "check") return `<div class="full"><label class="check"><input type="checkbox" data-k="${f.k}" data-check="1" ${v ? "checked" : ""}> ${esc(f.l)}</label></div>`;
    else input = `<input type="${f.t}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || "")}">`;
    return `<div class="${f.full ? "full" : ""}"><label>${esc(f.l)}${f.req ? " *" : ""}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
  }).join("") + `</div>` + extraHtml;
  openModal(title, body, [...extraBtns, { l: "취소", fn: closeModal }, { l: "저장", cls: "primary", fn: () => {
    const v = {};
    fields.filter((f) => f.t === "multi").forEach((f) => (v[f.k] = []));
    document.querySelectorAll("#fForm [data-k]").forEach((el) => {
      v[el.dataset.k] = el.dataset.multi ? [...el.selectedOptions].map((o) => o.value) : el.dataset.check ? el.checked : el.value.trim();
    });
    const miss = fields.find((f) => f.req && !v[f.k]);
    if (miss) { toast(`${miss.l} 입력 필요`); return; }
    if (onSave(v) !== false) { if ($("modalTitle").textContent === title) closeModal(); }
  } }], fields.length > 9);
  setTimeout(() => document.querySelector("#fForm [data-k]")?.focus(), 30);
}
