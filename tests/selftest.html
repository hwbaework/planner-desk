<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner Desk 자동 점검</title>
<style>
  :root { --bg: #f7f8f9; --panel: #fff; --line: #dcdfe4; --text: #172b4d; --dim: #44546f; --ok: #216e4e; --okw: #dcfff1; --bad: #ae2e24; --badw: #ffeceb; --accent: #0c66e4; }
  body { font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 16px; font-size: 15px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sum { margin: 10px 0 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill { padding: 4px 10px; border-radius: 3px; font-weight: 700; }
  .pill.ok { background: var(--okw); color: var(--ok); }
  .pill.bad { background: var(--badw); color: var(--bad); }
  button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; padding: 7px 14px; font: inherit; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { background: #f1f2f4; color: var(--dim); font-size: 12.5px; }
  td.r { font-weight: 700; white-space: nowrap; }
  td.r.ok { color: var(--ok); }
  td.r.bad { color: var(--bad); }
  .muted { color: var(--dim); font-size: 13px; }
  iframe { width: 1280px; height: 800px; border: 1px solid var(--line); margin-top: 16px; display: none; }
</style>
</head>
<body>
<h1>Planner Desk 자동 점검</h1>
<div class="muted">index.html을 분리된 저장 공간(?selftest)으로 열어 화면·알림·저장/불러오기를 확인한다. 실제 데이터는 건드리지 않는다.</div>
<div class="sum"><button onclick="run()">다시 점검</button><span id="sum"></span><label class="muted"><input type="checkbox" onchange="document.querySelector('iframe').style.display=this.checked?'block':'none'"> 앱 화면 보기</label></div>
<table><thead><tr><th style="width:60px">결과</th><th style="width:34%">점검 항목</th><th>상세</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="app"></iframe>
<script>
const results = [];
function check(name, fn) {
  try {
    const detail = fn();
    results.push({ ok: true, name, detail: detail === undefined ? "" : String(detail) });
  } catch (e) {
    results.push({ ok: false, name, detail: e.message });
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || "조건 불일치"); }
function show() {
  const fail = results.filter((r) => !r.ok).length;
  document.getElementById("sum").innerHTML = `<span class="pill ${fail ? "bad" : "ok"}">${results.length - fail} / ${results.length} 통과</span>${fail ? `<span class="pill bad">실패 ${fail}</span>` : ""}`;
  document.getElementById("rows").innerHTML = results.map((r) => `<tr><td class="r ${r.ok ? "ok" : "bad"}">${r.ok ? "통과" : "실패"}</td><td>${r.name}</td><td class="muted">${String(r.detail).replace(/</g, "&lt;")}</td></tr>`).join("");
  document.title = `${fail ? "실패 " + fail : "통과"} · Planner Desk 자동 점검`;
  window.SELFTEST = { total: results.length, fail, results };
}

function run() {
  results.length = 0;
  try { localStorage.removeItem("planner-desk-selftest"); } catch (e) {}
  const f = document.getElementById("app");
  f.onload = () => {
    const w = f.contentWindow, errors = [];
    w.addEventListener("error", (e) => errors.push(e.message));
    w.confirm = () => true;
    w.prompt = () => "자동 점검 입력";
    w.alert = () => {};
    w.open = () => null;
    try { tests(w, errors); } catch (e) { results.push({ ok: false, name: "점검 실행", detail: e.message }); }
    show();
  };
  f.src = "../index.html?selftest=" + Date.now();
}

function tests(w, errors) {
  // let/const 최상위 값은 window 속성이 아니라서 eval로 읽는다
  const S = () => w.eval("S"), t = w.today();
  const C = (name) => w.eval(name);
  const pid = () => S().projects[0].id;

  check("앱이 열리고 샘플 데이터가 들어감", () => {
    assert(S() && S().projects.length >= 1, "프로젝트 없음");
    assert(S().handoffs.length >= 1 && S().docs.length >= 19, "샘플 전달/산출물 없음");
    return `프로젝트 ${S().projects.length} · 전달 ${S().handoffs.length} · 산출물 ${S().docs.length}`;
  });
  check("실제 데이터와 분리된 저장 공간 사용", () => {
    assert(C("STORE_KEY") === "planner-desk-selftest", "STORE_KEY = " + C("STORE_KEY"));
  });
  check("모든 탭이 전체·프로젝트 보기에서 오류 없이 그려짐", () => {
    const bad = [];
    for (const p of ["all", pid()]) for (const [k] of C("TABS")) {
      try { S().ui.pid = p; S().ui.tab = k; w.render(); if (!w.document.getElementById("view").innerHTML.trim()) bad.push(k + " 빈 화면"); } catch (e) { bad.push(`${k}(${p === "all" ? "전체" : "프로젝트"}): ${e.message}`); }
    }
    assert(!bad.length, bad.join(" / "));
    return `${C("TABS").length}개 탭 × 2`;
  });
  check("보드 전체 · 프로젝트 그룹 보기", () => {
    const bad = [];
    for (const b of Object.keys(C("BOARDS"))) for (const g of ["none", "project"]) {
      try { S().ui.pid = "all"; S().ui.tab = "board"; S().ui.board = b; S().ui.boardGroup = g; w.render(); } catch (e) { bad.push(b + ": " + e.message); }
    }
    assert(!bad.length, bad.join(" / "));
    return Object.keys(C("BOARDS")).join(", ");
  });
  check("보드에서 기획중 → 전달 → 접수 → 완료노티로 넘기면 기록이 남음", () => {
    S().ui.pid = pid(); S().ui.board = "ho"; S().ui.tab = "board"; w.render();
    w.boardAdd("plan");
    const h = S().handoffs.find((x) => x.title === "자동 점검 입력");
    assert(h && h.status === "plan", "기획중 카드 생성 실패");
    w.boardMove(h.id, "sent"); assert(h.status === "sent" && h.sentAt === t, "전달 처리 실패");
    w.boardMove(h.id, "ack"); w.boardMove(h.id, "done");
    assert(h.status === "done", "완료노티 이동 실패: " + h.status);
    const types = h.events.map((e) => e.type).join(",");
    assert(types === "sent,ack,done", "이벤트: " + types);
    return types;
  });
  check("접수 노티 없음 → 접수 확인 기록 시 경고 해제", () => {
    const h = S().handoffs.find((x) => x.status === "sent" && w.bizDays(x.sentAt) > w.ackDaysOf(x.projectId));
    assert(h, "샘플에 접수 노티 없음 건이 없음");
    assert(w.computeAlerts(null).some((a) => a.kind === "접수 노티 없음" && a.ref[1] === h.id), "경고가 안 뜸");
    w.pushEvent(h, { type: "ack", at: t, text: "" });
    assert(!w.computeAlerts(null).some((a) => a.kind === "접수 노티 없음" && a.ref[1] === h.id), "경고가 안 사라짐");
    return h.code;
  });
  check("업무 마감이 캘린더에 표시되고 마감 지나면 경고", () => {
    S().tasks.push({ id: "t_test", projectId: pid(), title: "점검 업무", status: "진행중", priority: "high", start: w.addDays(t, -5), due: w.addDays(t, -1), owner: "", memo: "" });
    assert(w.calItems(w.addDays(t, -3), t, null).some((i) => i.kind === "task" && i.title === "점검 업무"), "캘린더에 없음");
    assert(w.computeAlerts(null).some((a) => a.kind === "업무 마감 지남" && a.ref[1] === "t_test"), "경고 없음");
    w.setTask("t_test", "status", "완료");
    assert(!w.computeAlerts(null).some((a) => a.ref[1] === "t_test"), "완료 후에도 경고");
  });
  check("정기 업무 완료 시 다음 회차가 오늘 이후로 이동", () => {
    S().recurring.push({ id: "r_test", projectId: pid(), title: "점검 주간보고", freq: "weekly", day: 3, nextDue: w.addDays(t, -10), history: [] });
    w.completeRecur("r_test");
    const r = S().recurring.find((x) => x.id === "r_test");
    assert(r.nextDue > t && w.parseD(r.nextDue).getDay() === 3, "다음 회차: " + r.nextDue);
    return r.nextDue;
  });
  check("데이터 협의: 합의 후 수신 예정 지나면 '데이터 미수신', 수신 기록 시 해제", () => {
    S().datas.push({ id: "d_test", projectId: pid(), name: "점검 데이터", org: "점검기관", status: "합의", dueDate: w.addDays(t, -2), log: [] });
    assert(w.computeAlerts(null).some((a) => a.kind === "데이터 미수신" && a.ref[1] === "d_test"), "경고 없음");
    w.openData("d_test");
    w.document.getElementById("dlType").value = "수신";
    w.document.getElementById("dlText").value = "수신 확인";
    w.addDataLog("d_test"); w.closeModal();
    assert(!w.computeAlerts(null).some((a) => a.ref[1] === "d_test"), "수신 후에도 경고");
  });
  check("테스트 케이스: 화면별 기본 TC 생성 → Fail → 결함 전달 → 재테스트 필요", () => {
    S().ui.pid = pid();
    const sc = S().screens.find((x) => x.projectId === pid());
    assert(sc, "샘플 화면 없음");
    const before = S().tcs.length; w.genTCs();
    const made = S().tcs.length - before;
    assert(made === S().screens.filter((x) => x.projectId === pid()).length * C("TC_TEMPLATES").length, "생성 수: " + made);
    const c = S().tcs.find((x) => x.screenId === sc.id);
    w.setTC(c.id, "result", "Fail");
    assert(w.computeAlerts(null).some((a) => a.kind === "결함 미전달" && a.ref[1] === c.id), "결함 미전달 없음");
    w.tcDefect(c.id); w.closeModal();
    const h = S().handoffs.find((x) => x.id === c.hoId);
    assert(h && /^\[결함\]/.test(h.title) && h.screenIds.includes(sc.id), "결함 전달 생성 실패");
    w.pushEvent(h, { type: "done", at: t, text: "" });
    assert(w.computeAlerts(null).some((a) => a.kind === "재테스트 필요" && a.ref[1] === c.id), "재테스트 필요 없음");
    return `TC ${made}개 · 결함 ${h.code}`;
  });
  check("메일 붙여넣기: 코드로 전달 건 매칭 · 회신 종류 판별", () => {
    const h = S().handoffs[0];
    const m = w.parseOutlookText(`보낸 사람: 홍길동 <dev@example.com>\n보낸 날짜: 2026년 10월 14일 화요일 오후 3:20\n제목: RE: [${h.code}] 확인 요청\n\n확인했습니다. 금요일까지 반영 예정입니다.\n\n-----Original Message-----\nFrom: 기획`);
    assert(m.date === "2026-10-14", "날짜: " + m.date);
    assert(!m.body.includes("Original"), "인용문이 안 잘림");
    assert(w.matchHandoff(m)?.h.id === h.id, "매칭 실패");
    const cases = [["확인했습니다. 금요일까지 반영 예정입니다.", "ack"], ["배포 완료했습니다", "done"], ["필수값이 맞나요?", "question"], ["현재 개발 중입니다", "progress"], ["10/20 완료 예정입니다", "note"]];
    const bad = cases.filter(([txt, want]) => w.guessType(txt) !== want).map(([txt, want]) => `${txt} → ${w.guessType(txt)} (기대 ${want})`);
    assert(!bad.length, bad.join(" / "));
    return `${h.code} · 판별 ${cases.length}건`;
  });
  check("메일 동기화 파일 불러오기: 같은 메일 두 번 들어오지 않음", () => {
    const h = S().handoffs[0], n0 = S().mails.length;
    const d = { exportedAt: new Date().toISOString(), account: "me@example.com", mails: [{ messageId: "<st@x>", from: "dev@example.com", subject: `[${h.code}] 완료`, date: t, body: "배포 완료했습니다" }] };
    w.importMailJson(d); w.importMailJson(d);
    assert(S().mails.length === n0 + 1, "중복 추가됨");
    assert(S().settings.mail.last?.account === "me@example.com", "마지막 동기화 기록 없음");
  });
  check("저장 HTML 왕복: 데이터가 그대로 들어가고 다시 읽힘", () => {
    const html = w.buildHtml();
    const m = html.match(/var EMBEDDED_DATA = ([\s\S]+?); \/\*EMBEDDED_DATA_PLACEHOLDER\*\//);
    assert(m, "데이터 표시를 못 찾음");
    assert((html.match(/EMBEDDED_DATA_PLACEHOLDER\*\//g) || []).length === 1, "표시가 여러 개");
    const d = JSON.parse(m[1]);
    for (const k of ["projects", "tasks", "handoffs", "docs", "datas", "tcs", "notes"]) assert(d[k].length === S()[k].length, k + " 개수 불일치");
    assert(!/<\/script>/i.test(m[1]), "스크립트 종료 태그가 데이터에 섞임");
    return `${Math.round(html.length / 1024)}KB`;
  });
  check("예전 사업관리 대시보드 백업 가져오기", () => {
    const n = S().tasks.length, e = S().events.length;
    w.importLegacy({ projects: [{ name: "점검 레거시" }], tasks: [{ project: "점검 레거시", title: "레거시 업무", status: "대기", due: t, calendarEventId: "ev1" }],
      events: [{ id: "ev1", project: "점검 레거시", title: "업무 연동 일정", startDate: t }, { id: "ev2", project: "점검 레거시", title: "출장", type: "출장", startDate: t }],
      recurring: [{ project: "점검 레거시", title: "주간보고", recurType: "weekly", recurDay: 3, nextDue: t }], notes: [{ project: "점검 레거시", title: "회의", date: t, content: "x" }] });
    assert(S().tasks.length === n + 1, "업무");
    assert(S().events.length === e + 1, "업무 연동 일정이 중복으로 들어옴");
    assert(S().projects.some((p) => p.name === "점검 레거시" && p.color), "프로젝트/색상");
  });
  check("화이트/다크 · 글자 크기 설정 반영", () => {
    S().settings.theme = "dark"; S().settings.fontScale = "1.2"; w.render();
    assert(w.document.documentElement.getAttribute("data-theme") === "dark", "다크 미적용");
    assert(String(w.document.body.style.zoom) === "1.2", "글자 크기 미적용");
    S().settings.theme = "light"; S().settings.fontScale = "1"; w.render();
    assert(w.document.documentElement.getAttribute("data-theme") === "light", "화이트 미적용");
  });
  check("창 열기·닫기(X)·Esc", () => {
    w.openSettings();
    assert(w.document.getElementById("modalBg").classList.contains("open"), "안 열림");
    w.document.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape" }));
    assert(!w.document.getElementById("modalBg").classList.contains("open"), "Esc로 안 닫힘");
  });
  // ── 점검 세션 리뷰(2026-10-15)에서 찾은 버그 재현 ──
  check("메모 입력 직후 다른 메모를 눌러도 덮어쓰지 않음", () => {
    S().ui.pid = pid(); S().ui.tab = "notes";
    const a = { id: "nA", projectId: pid(), title: "메모A", date: t, content: "A 내용" }, b = { id: "nB", projectId: pid(), title: "메모B", date: t, content: "B 내용" };
    S().notes.push(a, b); S().ui.noteId = "nA"; w.render();
    const c = w.document.getElementById("noteContent"); c.value = "A 수정"; c.dispatchEvent(new w.Event("input"));
    S().ui.noteId = "nB"; w.render();
    assert(a.content === "A 수정" && a.title === "메모A", `A: ${a.title}/${a.content}`);
    assert(b.content === "B 내용", "B가 바뀜: " + b.content);
  });
  check("질의 받음도 회신으로 보고 '접수 노티 없음' 해제", () => {
    const h = { id: "hq", code: "HO-901", projectId: pid(), title: "질의 점검", status: "sent", sentAt: w.addDays(t, -10), events: [], docIds: [], screenIds: [] };
    S().handoffs.push(h);
    assert(w.computeAlerts(null).some((a) => a.ref[1] === "hq" && a.kind === "접수 노티 없음"), "경고가 처음부터 없음");
    w.pushEvent(h, { type: "question", at: t, text: "" });
    assert(!w.computeAlerts(null).some((a) => a.ref[1] === "hq" && a.kind === "접수 노티 없음"), "질의 후에도 경고");
  });
  check("기록 삭제 시 상태를 다시 계산", () => {
    const h = S().handoffs.find((x) => x.id === "hq");
    w.pushEvent(h, { type: "done", at: t, text: "" });
    const ev = h.events.find((e) => e.type === "done");
    h.events = h.events.filter((e) => e !== ev); w.recomputeHOStatus(h);
    assert(h.status === "ack", "상태: " + h.status);
  });
  check("완료노티 단계 결함은 재테스트 Fail 시 같은 건 반려, 검수완료 뒤 Fail은 재발", () => {
    const c = S().tcs.find((x) => x.hoId && S().handoffs.find((h) => h.id === x.hoId)?.status === "done");
    assert(c, "앞 단계의 결함 TC가 없음");
    const ho = S().handoffs.find((h) => h.id === c.hoId);
    w.setTC(c.id, "result", "Fail");
    assert(c.hoId === ho.id && ho.status === "dev" && ho.events.some((e) => e.type === "reject"), "반려가 안 됨: " + ho.status);
    w.pushEvent(ho, { type: "done", at: t, text: "" }); w.pushEvent(ho, { type: "verified", at: t, text: "" });
    w.setTC(c.id, "result", "Fail");
    assert(!c.hoId && (c.prevHoIds || []).length === 1, "연결이 안 풀림");
    assert(w.computeAlerts(null).some((a) => a.ref[1] === c.id && a.kind === "결함 미전달"), "결함 미전달 경고 없음");
    assert(!w.computeAlerts(null).some((a) => a.ref[1] === c.id && a.kind === "재테스트 필요"), "재테스트 필요가 남음");
  });
  check("보드 '다음 →'은 완료 칸에서 예외 칸으로 넘기지 않음", () => {
    S().ui.pid = pid(); S().ui.tab = "board"; S().ui.board = "docs"; w.render();
    const col = w.document.querySelector('.col[data-col="승인"]');
    assert(col && !col.querySelector(".next"), "승인 칸에 다음 버튼이 있음");
    S().ui.board = "tc"; w.render();
    const tcCol = w.document.querySelector('.col[data-col="Pass"]');
    assert(!tcCol || !tcCol.querySelector(".next"), "Pass 칸에 다음 버튼이 있음");
  });
  check("산출물 폼에서 상태를 바꿔도 검토요청일·승인일이 채워짐", () => {
    const d = S().docs.find((x) => x.projectId === pid() && x.status === "미착수");
    w.editDoc(d.id);
    w.document.querySelector('#fForm [data-k="status"]').value = "검토요청";

    assert(types.join(",") === "업무,결정,리스크", "유형: " + types.join(","));
    [...w.document.querySelectorAll("#modalFoot button")].find((b) => b.textContent === "등록").click();
    const rs = S().risks.filter((r) => r.noteId === "n_dr");
    assert(rs.length === 2 && rs.find((r) => r.type === "결정").status === "종료", "결정·리스크 등록 실패");
    assert(S().tasks.some((x) => x.noteId === "n_dr"), "업무 등록 실패");
    assert(!w.computeAlerts(pid()).some((a) => rs.find((r) => r.type === "결정").id === a.ref[1]), "결정에 경고가 뜸");
  });
  check("요구사항 붙여넣기 후 새 번호가 겹치지 않음 · 화면 연결은 합침 (5차 1번)", () => {
    S().ui.pid = pid();
    S().reqs.push({ id: "rq_a", projectId: pid(), code: "REQ-050", title: "기존", status: "접수", screenIds: ["s_keep"] });
    const max = Math.max(...S().reqs.map((r) => Number(String(r.code).replace(/\D/g, "")) || 0));
    const c = w.nextReqCode();
    assert(Number(c.replace(/\D/g, "")) === max + 1, `새 번호 ${c} (기존 최대 ${max})`);
    assert(!S().reqs.some((r) => r.code === c), "이미 있는 번호");
  });
  check("전달 건을 지우면 화면 연결·미전달 표시가 정리됨 (5차 2번)", () => {
    S().ui.pid = pid();
    const sc = { id: "s_rel", projectId: pid(), code: "SCR-REL", name: "연결 점검", version: "v1.0", status: "확정", history: [] };
    S().screens.push(sc);
    const h = { id: "h_rel", code: "HO-990", projectId: pid(), title: "연결 점검 전달", status: "plan", events: [], docIds: [], screenIds: ["s_rel"] };
    S().handoffs.push(h); w.pushEvent(h, { type: "sent", at: t, text: "" });
    assert(sc.hoId === "h_rel" && sc.lastSentVer === "v1.0", "전달 시 연결 안 됨");
    sc.version = "v1.1";
    assert(w.computeAlerts(pid()).some((a) => a.ref[1] === "s_rel"), "미전달 경고 없음");
    S().handoffs = S().handoffs.filter((x) => x.id !== "h_rel"); w.relinkScreens();
    assert(!sc.hoId && sc.lastSentVer === undefined, "연결이 남음");
    assert(!w.computeAlerts(pid()).some((a) => a.ref[1] === "s_rel"), "삭제 후에도 경고");
  });
  check("변경분 요약은 마지막 전달 이후 이력만 (5차 3번)", () => {
    const sc = { id: "s_ver", projectId: pid(), code: "SCR-VER", name: "버전 점검", version: "v1.10", status: "확정", hoId: "x", lastSentVer: "v1.10", lastSentAt: "2026-10-10T00:00:00.000Z",
      history: [{ at: "2026-10-01", ts: "2026-10-01T00:00:00.000Z", from: "v1.8", to: "v1.9", text: "옛 변경" }, { at: t, ts: new Date().toISOString(), from: "v1.10", to: "v1.11", text: "새 변경" }] };
    S().screens.push(sc); w.sendRevision("s_ver");
    const memo = w.document.querySelector('#fForm [data-k="memo"]').value;
    w.closeModal();
    assert(memo.includes("새 변경") && !memo.includes("옛 변경"), memo);
  });
  check("비어 있는 관리 메뉴는 접히고, 항목이 있으면 보임 (5차 5번)", () => {
    S().ui.pid = pid(); S().ui.tab = "dash"; S().ui.navMore = false; w.render();
    const names = [...w.document.querySelectorAll("#sideNav .navi .nm")].map((e) => e.textContent);
    assert(names.includes("업무"), "업무 메뉴가 숨겨짐");
    assert(names.some((n) => /아직 안 쓰는 메뉴|접기/.test(n)) || !names.length === false, "접기 줄 처리");
  });
  check("파일 저장 알림: 저장한 적 없거나 하루 지나면 배너, '오늘은 그만'이면 숨김", () => {
    S().fileSavedAt = ""; S().ui.saveNagSnooze = ""; w.persist(); w.render();
    assert(w.document.getElementById("bannerArea").textContent.includes("파일로 저장한 적이 없어"), "배너 없음");
    S().ui.saveNagSnooze = t; w.render();
    assert(!w.document.getElementById("bannerArea").textContent.includes("파일로 저장"), "숨김 안 됨");
    S().ui.saveNagSnooze = ""; S().fileSavedAt = new Date(Date.now() + 60000).toISOString(); w.render();
    assert(!w.document.getElementById("bannerArea").textContent.includes("파일로 저장"), "방금 저장했는데 배너");
    w.openSettings(); assert(w.document.getElementById("modalBody").textContent.includes("마지막 파일 저장"), "설정에 데이터 정보 없음"); w.closeModal();
  });
  check("주간보고 인쇄용 문서: 제목·프로젝트·단계 구조로 변환", () => {
    let html = "", printed = false;
    const keep = w.open;
    w.open = () => ({ document: { write: (h) => (html += h), close() {} }, focus() {}, print() { printed = true; } });
    w.printReport(w.buildReport([pid()], 0));
    w.open = keep;
    assert(html.includes("<h1>주간 보고") && html.includes("<h2>") && html.includes("<h3>1. 금주 실적"), "구조 변환 실패");
    assert(!/<script/i.test(html), "스크립트가 섞임");
  });
  check("인쇄할 때 메뉴·버튼은 숨김 규칙이 있음", () => {
    const css = [...w.document.styleSheets].flatMap((s) => { try { return [...s.cssRules]; } catch (e) { return []; } }).filter((r) => r.media && /print/.test(r.media.mediaText)).map((r) => r.cssText).join(" ");
    assert(/\.side/.test(css) && /\.top/.test(css) && /\.btn/.test(css), "인쇄용 규칙 없음");
  });
  check("되돌리기: 삭제를 Ctrl+Z로 복구, 보던 화면은 유지", () => {
    S().ui.pid = pid(); S().ui.tab = "tasks"; w.render();
    w.eval("lastPushAt = 0");
    const before = S().tasks.length, victim = S().tasks.find((x) => x.projectId === pid());
    S().tasks = S().tasks.filter((x) => x !== victim); w.commit();
    assert(S().tasks.length === before - 1, "삭제 안 됨");
    w.document.body.focus();
    w.document.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true }));
    assert(S().tasks.length === before && S().tasks.some((x) => x.id === victim.id), "복구 안 됨");
    assert(S().ui.tab === "tasks", "화면이 바뀜");
  });
  check("마일스톤: 다음 마일스톤 D-day 표시, 타임라인 마름모, 지난 것은 제외", () => {
    S().events.push({ id: "ms_old", projectId: pid(), title: "착수보고", type: "마일스톤", start: w.addDays(t, -30) },
                    { id: "ms_next", projectId: pid(), title: "중간점검 보고", type: "마일스톤", start: w.addDays(t, 12) });
    assert(w.nextMilestone(pid()).id === "ms_next", "다음 마일스톤 틀림");
    S().ui.pid = pid(); S().ui.tab = "dash"; w.render();
    assert(w.document.querySelector(".page-head .ms-tag")?.textContent.includes("D-12"), "대시보드에 D-day 없음");
    S().ui.tab = "timeline"; S().ui.tlZoom = "month"; w.render();
    assert([...w.document.querySelectorAll(".tl-r.grp .tl-ms")].some((e) => (e.getAttribute("title") || "").includes("중간점검 보고")), "타임라인 마름모 없음");
  });
  check("되돌리기 후에도 최신 변경으로 저장, 저장 시각 유지, 삭제는 별도 단계 (6차 1·2·5번)", () => {
    S().fileSavedAt = "2026-10-15T00:00:00.000Z"; w.persist();
    w.eval("lastPushAt = 0");
    const tk = S().tasks.find((x) => x.projectId === pid() && x.status !== "완료");
    const prevStatus = tk.status;
    w.setTask(tk.id, "status", "대기");
    S().tasks = S().tasks.filter((x) => x.id !== tk.id); w.commit();   // 1초 안에 삭제
    const before = S().updatedAt;
    w.undo();
    const back = S().tasks.find((x) => x.id === tk.id);
    assert(back && back.status === "대기", "삭제만 되돌려야 함: " + (back && back.status));
    assert(S().updatedAt > before, "되돌린 뒤 updatedAt이 과거로 감");
    assert(S().fileSavedAt === "2026-10-15T00:00:00.000Z", "파일 저장 시각이 되돌아감");
    w.undo(); assert(S().tasks.find((x) => x.id === tk.id).status === prevStatus, "상태 변경 되돌리기 실패");
    const m = w.buildHtml().match(/var EMBEDDED_DATA = ([\s\S]+?); \/\*EMBEDDED_DATA_PLACEHOLDER\*\//);
    assert(JSON.parse(m[1]).fileSavedAt, "저장 파일에 저장 시각 없음");
  });
  check("이모지 아이콘 없음", () => {
    const src = w.document.documentElement.outerHTML;
    const m = src.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}]/u);
    assert(!m, "발견: " + (m && m[0]));
  });
  check("점검 중 스크립트 오류 없음", () => {
    assert(!errors.length, errors.join(" / "));
  });
}
run();
</script>
</body>
</html>
